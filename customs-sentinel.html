<!-- ══ CUSTOMS SENTINEL LOGIN OVERLAY ══ -->
<div id="login-overlay" style="display:flex;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a);align-items:center;justify-content:center;padding:1.5rem;position:fixed;inset:0;z-index:99999">
  <div style="width:100%;max-width:28rem">

    <div style="display:flex;align-items:center;gap:.875rem;margin-bottom:2rem">
      <div style="width:2.75rem;height:2.75rem;background:rgba(255,255,255,.12);border-radius:.75rem;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2)">
        <div style="width:1rem;height:1rem;background:#fff;border-radius:3px"></div>
      </div>
      <div>
        <p style="font-size:19px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1">Customs Sentinel</p>
        <p style="font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.12em;margin:0">Republic of Moldova · ANSA</p>
      </div>
    </div>

    <div style="background:#fff;border-radius:1.125rem;padding:2rem;box-shadow:0 32px 64px rgba(0,0,0,.45)">
      <p style="font-size:17px;font-weight:900;color:#1e293b;margin:0 0 .25rem">Officer Login</p>
      <p style="font-size:12px;color:#64748b;margin:0 0 1.5rem">ASYCUDA World — Sistemul informațional integrat vamal</p>

      <div style="display:flex;flex-direction:column;gap:1rem">

        <div>
          <label style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.375rem">Checking Point (CCP)</label>
          <select id="login-ccp" style="width:100%;padding:.75rem 1rem;border:1px solid #e2e8f0;border-radius:.625rem;font-size:14px;color:#1e293b;background:#f8fafc;box-sizing:border-box">
            <option value="">— Select your CCP —</option>
          </select>
        </div>

        <div>
          <label style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.375rem">Full name</label>
          <input id="login-name" type="text" placeholder="Ion Popescu" style="width:100%;padding:.75rem 1rem;border:1px solid #e2e8f0;border-radius:.625rem;font-size:14px;color:#1e293b;background:#f8fafc;box-sizing:border-box"/>
        </div>

        <div>
          <label style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.375rem">Badge / Job ID</label>
          <input id="login-badge" type="text" placeholder="ANS-2024-0042" style="width:100%;padding:.75rem 1rem;border:1px solid #e2e8f0;border-radius:.625rem;font-size:14px;color:#1e293b;background:#f8fafc;box-sizing:border-box"/>
        </div>

        <div>
          <label style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.375rem">Password</label>

        </div>

        <div id="login-err" style="display:none;padding:.625rem .875rem;background:#fff5f5;border:1px solid #fca5a5;border-radius:.5rem">
          <p style="font-size:12px;color:#dc2626;margin:0" id="login-err-msg"></p>
        </div>

        <button id="login-btn" onclick="doLogin()" style="width:100%;padding:.875rem;background:#1e40af;color:#fff;border:none;border-radius:.625rem;font-size:15px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.05em">
          Log In →
        </button>
      </div>
    </div>

      Customs Sentinel · ANSA Moldova · 2024
    </p>
  </div>
</div>

<script>
// Build CCP dropdown from PVFI_POSTS (defined in main script below)
// Run after main script loads
// Populate CCP dropdown — retry until PVFI_POSTS is available
(function populateCCPs() {
  if(typeof PVFI_POSTS === 'undefined') { setTimeout(populateCCPs, 100); return; }
  var sel = document.getElementById('login-ccp');
  var types = ['rutier','feroviar','aerian'];
  Object.entries(PVFI_POSTS).forEach(function(entry) {
    var birou = entry[0], bv = entry[1];
    types.forEach(function(tp) {
      (bv[tp]||[]).forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = JSON.stringify({code:p.code, name:p.name, type:tp, birou:birou, note:p.note||''});
        opt.textContent = p.name + ' (' + p.code + ') · ' + birou + ' · ' + tp;
        sel.appendChild(opt);
      });
    });
  });
})();

function showErr(msg) {
  document.getElementById('login-err').style.display = 'block';
  document.getElementById('login-err-msg').textContent = msg;
}

function doLogin() {
  var ccp  = document.getElementById('login-ccp').value;
  var name = document.getElementById('login-name').value.trim();
  var badge= document.getElementById('login-badge').value.trim();
  var pass = document.getElementById('login-pass').value.trim();

  if(!ccp)   return showErr('Please select your Checking Point.');
  if(!name)  return showErr('Enter your full name.');
  if(!badge) return showErr('Enter your badge / job ID.');
  if(!pass)  return showErr('Enter your password.');

  try {
    var ccpObj = JSON.parse(ccp);
    ccpObj.officerName  = name;
    ccpObj.officerBadge = badge;

    // Hide the overlay
    document.getElementById('login-overlay').style.display = 'none';

    // Call Preact state setter (exposed via useEffect)
    var attempts = 0;
    var tryLogin = function() {
      if(typeof window._sentinelLogin === 'function') {
        window._sentinelLogin(ccpObj);
      } else if(attempts < 20) {
        attempts++;
        setTimeout(tryLogin, 100);
      }
    };
    tryLogin();
  } catch(e) {
    showErr('Error: ' + e.message);
  }
}
// Allow Enter key to submit
document.addEventListener('keydown', function(e) {
  if(e.key === 'Enter') doLogin();
});
</script>

/* Lookup: returns [{hs, desc, keyword}] for a given goods string */
function lookupHS(text) {
  if(!text||text.length<2) return [];
  const lower = text.toLowerCase();
  const hits = [];
  for(const [kw, val] of Object.entries(HS_KEYWORDS)) {
    if(lower.includes(kw)) hits.push({hs:val.hs, desc:val.desc, keyword:kw});
  }
  // Deduplicate by HS code
  return hits.filter((h,i,a)=>a.findIndex(x=>x.hs===h.hs)===i).slice(0,4);
}

function calculateRisk(decl) {
  if(!decl) return {score:10, factors:[], lane:'GREEN'};
  let score = BASE_SCORE;
  const factors = [];

  // Rule 1 — importer watchlist
  if (WATCHLIST_IMPORTERS.includes(decl.importerName)) {
    score += 50;
    factors.push("Importer on internal watchlist.");
  }
  // Rule 2 — origin port historical risk profiling
  if (HIGH_RISK_PORTS.includes(decl.originPort)) {
    score += 30;
    factors.push(`Origin port (${decl.originPort}) flagged for smuggling history.`);
  }

  const foreignPlate = decl.licensePlate && !decl.licensePlate.toUpperCase().startsWith("MD");
  const roadVehicle  = ["Car","Minivan","Van","Truck","Bus","Motorcycle"].includes(decl.vehicleType||decl.transportType);
  const vehAge       = decl.vehicleYear ? (2026 - Number(decl.vehicleYear)) : 0;

  // Rule 3 — Foreign vehicle declared as personal use → 90-day temporary import
  if (foreignPlate && roadVehicle && (decl.goodsType === "personal" || !decl.goodsType)) {
    score += 35;
    factors.push(
      `⚠ Foreign vehicle (${decl.licensePlate||"unknown plate"}) entered as personal use — subject to 90-day temporary import limit (Art. 218 CC RM). ` +
      `Officer must verify: is the vehicle being left in Moldova for sale or spare parts? ` +
      `If yes → mandatory import declaration required at this CCP. Duties + 20% VAT apply.`
    );
  }

  // Rule 4 — Foreign vehicle DECLARED as a good (for sale or import) → verify declaration completeness
  if (foreignPlate && roadVehicle && decl.goodsType === "vehicle") {
    score += 25;
    factors.push(
      `Foreign vehicle declared as an import good (HS 87.xx). ` +
      `Verify correct HS code (8703 = car, 8704 = truck, 8708 = parts), declared value against market price, and that customs duties + 20% VAT have been assessed. ` +
      `Do not release until payment confirmed.`
    );
  }

  // Rule 5 — Repeated crossings: same foreign vehicle re-entering to reset 90-day counter
  if (foreignPlate && roadVehicle && (decl.frequency||1) >= 3) {
    score += 25;
    factors.push(
      `Vehicle has crossed ${decl.frequency}+ times. Repeated exit/re-entry pattern is used to reset the 90-day counter and avoid import declaration. ` +
      `Per Art. 218 CC RM, repeated temporary importation of the same vehicle may be refused by customs.`
    );
  }

  // Rule 6 — Old foreign vehicle: high spare-parts risk
  if (foreignPlate && roadVehicle && vehAge >= 10) {
    score += 20;
    factors.push(
      `Vehicle is ${vehAge} years old — old foreign vehicles (>10y) are a primary vehicle for the spare-parts trade scheme. ` +
      `Owner may intend to sell parts individually (HS 8708.xx) without paying import duty. ` +
      `Inspect for signs of disassembly. If parts have been removed, apply HS 8708 duties.`
    );
  }

  // Rule 7 — High declared value + foreign plate: check underdeclaration
  if (foreignPlate && roadVehicle && (decl.declaredValue||0) > 0 && (decl.declaredValue||0) < 1000 && vehAge < 15) {
    score += 15;
    factors.push(
      `Declared value (€${decl.declaredValue}) is unusually low for a ${vehAge}-year-old foreign vehicle. ` +
      `Check against Eurotax / market value. Underdeclaring vehicle value reduces import duties — a common evasion tactic.`
    );
  }

  const lane = score >= 75 ? "RED" : score >= 40 ? "YELLOW" : "GREEN";
  return { score, factors, lane };
}

// Pre-compute risk for all declarations on load (mirrors process_declarations())
function runRiskEngine(declarations) {
  return (declarations||[]).filter(Boolean).map(d => {
    const result = calculateRisk(d);
    // Run RF inline for every declaration
    let rfFraudProb = d.rfFraudProb ?? null;
    if(rfFraudProb == null) {
      try {
        const rf = rfPredict(d, MOCK_DECLARATIONS || []);
        rfFraudProb = Math.round(rf.probability * 100);
      } catch(e) { rfFraudProb = Math.round((d.nonComplianceProbability || 0.3) * 100); }
    }
    return { ...d,
      engineScore: result.score,
      engineFactors: result.factors,
      engineLane: result.lane,
      engineProcessed: true,
      rfFraudProb,
    };
  });
}

/* ============ CLAUDE API ============ */
async function analyzeDeclaration(d) {
  // Instant local fallback — works without API
  const localFallback = {
    score: d.riskScore||d.engineScore||50,
    level: (d.riskScore||50)>=75?'HIGH':(d.riskScore||50)>=50?'MEDIUM':(d.riskScore||50)>=25?'LOW':'MINIMAL',
    grade: d.dtGrade||2,
    analysis: d.riskReason || (d.reportImportSource ? 'Imported from: '+d.reportImportSource : 'Risk engine assessment based on declaration data.'),
    flags: d.engineFactors||[],
    assignedChannel: d.assignedChannel||'GREEN',
    decisionPath: ['Step 1: Check crossing frequency ('+((d.dtFrequency||'unknown')+')'), 'Step 2: Evaluate destination ('+((d.dtDestination||'—')+')'), 'Step 3: Vehicle type ('+((d.dtVehicle||d.vehicleType||'—')+')'),'Step 4: Apply risk engine score ('+((d.riskScore||50)+')'), 'Step 5: Assign channel → '+(d.assignedChannel||'GREEN')],
    nonComplianceProbability: d.nonComplianceProbability||(d.riskScore||50)/100,
    predictedCorrectDuty: d.predictedCorrectDuty||d.declaredDuty||0,
    queueSurgeFactor: d.queueSurgeFactor||0.5,
  };

  try {
    const prompt = `You are a Customs Risk Analysis AI using a Decision Tree model (Gain Ratio + Information Gain criteria). Analyze this declaration and respond ONLY with valid JSON (no markdown).

Decision Tree Attributes (from research): Destination, Vehicle Type, Frequency → Risk Grade (1=Minimal,2=Low,3=Medium,4=High)
Known HIGH RISK patterns: France+Van/Bus+usually, Belgium+Van+usually, Italy+Bus+usually
Known MEDIUM RISK: Romania+Car/VanTrailer+sometimes, Italy+Van+sometimes, Belgium+Minivan/Bus+sometimes
Known LOW RISK: Romania+Bus+often, Italy+Minivan/VanTrailer+often, Germany+Van+often
Known MINIMAL RISK: Any Destination+*/never, UK combinations

Declaration: MRN=${d.mrn}, Origin=${d.originCountry}, HS=${d.hsCode}
FinalDestination=${d.finalDestination}, VehicleType=${d.dtVehicle||d.vehicleType}, Frequency=${d.dtFrequency||"unknown"}
DeclaredDTGrade=${d.dtGrade||"unknown"}, Value=€${d.declaredValue} vs FMV=€${d.fmvBaseline}
Channel=${d.assignedChannel}, RiskScore=${d.riskScore}
RuleEngineScore=${d.engineScore||"n/a"}, EngineFactors=${JSON.stringify(d.engineFactors||[])}, EngineLane=${d.engineLane||"n/a"}

Return JSON: {"score":0-100,"level":"MINIMAL|LOW|MEDIUM|HIGH","grade":1-4,"analysis":"1-2 sentences referencing Destination+Vehicle+Frequency pattern","flags":["flag"],"assignedChannel":"GREEN|YELLOW|RED","decisionPath":["step1: check Frequency","step2: evaluate Destination","step3: confirm Vehicle Type","step4: apply Gain Ratio criterion","step5: assign Grade"],"nonComplianceProbability":0.5,"predictedCorrectDuty":0,"queueSurgeFactor":0.5}`;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:prompt}]})
    });
    if(!res.ok) return localFallback;
    const data = await res.json();
    if(data.error) return localFallback;
    const txt = (data.content?.[0]?.text||"{}").replace(/```json|```/g,"").trim();
    return JSON.parse(txt);
  } catch(e) {
    return localFallback;
  }
}

async function digitizeReport(b64) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
      {type:"text",text:"Extract customs seizure data: NCTS discrepancies, Guarantee Management, Transit Status fields."}
    ]}]})
  });
  const data = await res.json();
  return data.content?.[0]?.text || "Failed to parse report.";
}

async function chatWithSentinel(history, message) {
  const msgs = history.map(m => ({role: m.role==="model"?"assistant":"user", content: m.text}));
  msgs.push({role:"user", content: message});
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
      system:"You are 'Customs Sentinel', expert customs risk analyst for Moldova Customs. You apply a Decision Tree model (Gain Ratio + Information Gain criteria) that classifies cigarette smuggling risk by Destination, Vehicle Type, and Frequency into 4 grades: 1=Minimal, 2=Low, 3=Medium, 4=High. High-risk patterns include France/Belgium+Van+usually and Italy+Bus+usually. Explain decisions clearly and concisely.",
      messages: msgs})
  });
  const data = await res.json();
  return data.content?.[0]?.text || "Connection error.";
}

function DecisionTree() {
  /* Paper's decision tree: Criterion = Gain Ratio + Information Gain
     Root attribute: Frequency (highest gain ratio)
     Branches → Destination → Vehicle Type → Risk Grade */
  const Node = ({label,sub,col="bg-in100",tc="c-in9",bc="bc-in300"}) => html`
    <div class=${"px-4 py-2 b-1 r-sm sh-md " + col + " " + bc}>
      <span class=${"tx-xs fw-9 ls-tight block " + tc}>${label}</span>
      ${sub ? html`<span class="tx-8 fw-7 c-sl4 block mt-1 italic">${sub}</span>` : null}
    </div>`;
  const Leaf = ({grade,label,ch}) => {
    const m = GRADE_META[grade];
    return html`
      <div class=${"p-3 r-sm b-1 sh-sm flex flex-col items-center " + m.col + " " + m.bc} style="min-width:5.5rem">
        <div class=${"w-6 h-6 r-full flex items-center justify-center tx-xs fw-9 mb-1 " + m.dot} style="color:#fff">${grade}</div>
        <span class=${"tx-8 fw-9 upcase tc " + m.tc}>${label}</span>
        <span class=${"tx-8 fw-7 upcase tc mt-1 " + m.tc}>${ch}</span>
      </div>`;
  };
  return html`<div class="bg-white r-2h b-1 bc-sl200 sh-xl of-hidden">
    <div class="p-6 bb bc-sl100 bg-sl50a flex justify-between items-center">
      <div>
        <h3 class="tx-10 fw-9 c-sl4 upcase ls-widest mb-1">Cigarette Smuggling Decision Tree</h3>
        <p class="tx-xs fw-7 c-sl9 upcase italic">Criterion: Gain Ratio + Information Gain · 28-record training set</p>
      </div>
      <div class="flex gap-2">
        <div class="px-3 py-1 bg-sl900 r-full"><span class="tx-8 fw-9 c-in4 upcase ls-wide">Pre-pruned</span></div>
        <div class="px-3 py-1 bg-in600 r-full"><span class="tx-8 fw-9 c-white upcase ls-wide">Post-pruned</span></div>
      </div>
    </div>
    <div class="p-8">
      <!-- Level 1: Root – Frequency -->
      <div class="flex flex-col items-center">
        <div class="px-5 py-3 bg-sl900 b-1 bc-sl800 r-xl sh-md flex items-center gap-3">
          <div class="w-2 h-2 bg-in400 r-full pulse"></div>
          <span class="tx-sm fw-9 c-white upcase ls-tight">Root Node: Frequency</span>
          <span class="tx-8 fw-7 c-sl3 italic">↑ Gain Ratio</span>
        </div>
        <!-- connector -->
        <div class="w-px h-6" style="background:#e2e8f0"></div>
        <!-- Level 2: 4 frequency branches -->
        <div class="w-full flex justify-between items-start gap-2 relative">
          <div class="absolute top-0 left-0 right-0 h-px" style="top:0;background:#e2e8f0"></div>
          ${[
            {freq:"never",    label:"never",    sub:"→ Grade 1 (Minimal)",  col:"bg-em50",  tc:"c-em7", bc:"bc-em100"},
            {freq:"often",    label:"often",    sub:"→ Grade 1–2",          col:"bg-in50",  tc:"c-in6", bc:"bc-in100"},
            {freq:"sometimes",label:"sometimes",sub:"→ Grade 3 mostly",     col:"bg-am50",  tc:"c-am7", bc:"bc-am100"},
            {freq:"usually",  label:"usually",  sub:"→ Grade 4 (High)",     col:"bg-ro50",  tc:"c-ro7", bc:"bc-ro200"}
          ].map(b=>html`
            <div key=${b.freq} class="flex flex-col items-center flex-1 pt-3">
              <div class=${"w-px h-6 " + b.col.replace("bg-","bg-")} style="background:#e2e8f0"></div>
              <div class=${"px-3 py-1h r-md b-1 tx-9 fw-9 upcase " + b.col + " " + b.tc + " " + b.bc}>${b.label}</div>
              <div class="w-px h-4" style="background:#e2e8f0"></div>
              <!-- Level 3: Destination sub-node or direct leaf -->
              ${(()=>{
                if(b.freq==="never"||b.freq==="usually")
                  return html`<${Leaf} grade=${b.freq==="never"?1:4} label=${b.freq==="never"?"Minimal":"High Risk"} ch=${b.freq==="never"?"GREEN":"RED"}/>`;
                const destList = b.freq==="often"
                  ? [["France/BE",2],["Italy",2],["Germany",2],["Romania",1]]
                  : [["France",3],["Belgium",3],["Italy",3],["Germany",3]];
                return html`<div class="px-3 py-1h bg-sl100 b-1 bc-sl200 r-md tx-8 fw-9 upcase c-sl6">Destination?</div>
                  <div class="flex gap-3 mt-2 flex-wrap justify-center">
                    ${destList.map(([d,n])=>html`<div key=${d} class="flex flex-col items-center"><span class="tx-8 c-sl4 italic mb-1">${d}</span><${Leaf} grade=${n} label=${GRADE_META[n].short||"G"+n} ch=${GRADE_META[n].ch}/></div>`)}
                  </div>`;
              })()}
            </div>`)}
        </div>
      </div>
    </div>
    <div class="p-6 bt bc-sl100 bg-sl50a grid md-cols-3 gap-4">
      ${[
        ["Attribute 1","Frequency","Gain Ratio — most discriminating split","bg-sl900","c-in4","bc-sl800"],
        ["Attribute 2","Destination","Gain Ratio + Info Gain — second split","bg-in600","c-white","bc-in500"],
        ["Attribute 3","Vehicle Type","Info Gain — third-level split","bg-in50","c-in6","bc-in200"]
      ].map(([a,n,d,bg,tc,bc])=>html`
        <div class=${"p-4 r-xl b-1 " + bg + " " + bc}>
          <p class=${"tx-8 fw-9 upcase ls-widest mb-1 " + (bg==="bg-sl900"?"c-sl4":tc)}>${a}</p>
          <p class=${"tx-xs fw-9 italic mb-1 " + tc}>${n}</p>
          <p class=${"tx-9 fw-5 lh-tight " + (bg==="bg-sl900"?"c-sl3":bg==="bg-in600"?"c-in1":"c-sl6")}>${d}</p>
        </div>`)}
    </div>
  </div>`;
}

                  <div class="flex justify-between tx-9 fw-7 mb-1"><span class="c-sl5">${k}</span><span class=${vc}>${v}</span></div>`)}

              </div>
              <div class="p-6 bg-em50 r-2xl b-1 bc-em200">
                <p class="tx-10 fw-9 c-em7 upcase mb-3">Random Forest (100 Trees)</p>
                ${[["Train accuracy",(RANDOM_FOREST.trainAccuracy*100).toFixed(1)+"%","c-sl8"],["Test accuracy",(RANDOM_FOREST.testAccuracy*100).toFixed(1)+"%","c-em6"],["Max depth","8 (pruned)","c-em6"],["Overfitting",RANDOM_FOREST.vsDecisionTree.overfitReduction+" reduction","c-em6"]].map(([k,v,vc])=>html`

              <p class="tx-10 fw-9 c-in4 upcase">Why RF outperforms single DT</p>

                ["Feature sampling","Random subset of features per split → decorrelated trees"],
                ["Majority vote","Aggregation reduces variance without increasing bias"],
                ["OOB validation","37% unseen data per tree → built-in cross-validation"]
              ].map(([k,v])=>html`
                <div class="flex items-start gap-3">
                  <div class="w-2 h-2 bg-in400 r-full shrink-0 mt-1h"></div>
                  <div><p class="tx-9 fw-9 c-in3 upcase mb-1">${k}</p><p class="tx-9 fw-5 c-sl3 lh-relax">${v}</p></div>

              <div class="p-4 bg-w5 r-xl b-1 bc-w10 mt-2">
                <p class="tx-xs fw-9 c-em4">+${RANDOM_FOREST.vsDecisionTree.improvement} accuracy over single Decision Tree</p>
              </div>
            </div>
          </div>
        `;
      })()}

    <!-- Trained Scenarios Archive -->

}

function ReportUploader({ decls, setDecls, setView, setChFilter, setOfficerCCP, setCCP }) {
  /* ─── STATE ─── */
  const [file,        setFile]        = useState(null);
  const [preview,     setPreview]     = useState(null);
  const [loading,     setLoading]     = useState(false);
  const [stage,       setStage]       = useState(null);
  const [report,      setReport]      = useState(null);   // parsed report data
  const [scenarios,   setScenarios]   = useState([]);     // past scenarios extracted
  const [rfResults,   setRfResults]   = useState([]);     // live RF reassessments
  const inputRef = useRef(null);

  /* ─── File pick ─── */
  const pick = e => {
    const f = e.target.files?.[0]; if(!f) return;
    setFile(f);
    const isDocx = f.name.endsWith('.docx')||f.name.endsWith('.doc');
    if(isDocx) {
      // For DOCX: extract text via mammoth, store as text blob
      const ar = new FileReader();
      ar.onloadend = async () => {
        try {
          const mammoth = await import('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.esm.js');
          const result  = await mammoth.extractRawText({arrayBuffer: ar.result});
          setPreview('data:text/plain;base64,'+btoa(unescape(encodeURIComponent(result.value.slice(0,8000)))));
        } catch(e2) {
          // Fallback: base64 of file bytes
          const fr = new FileReader();
          fr.onloadend = () => setPreview(fr.result);
          fr.readAsDataURL(f);
        }
      };
      ar.readAsArrayBuffer(f);
    } else {
      // PDF or image: base64 data URL
      const r = new FileReader();
      r.onloadend = () => setPreview(r.result);
      r.readAsDataURL(f);
    }
  };

  /* ─── Step 1: Upload → Claude Vision extracts past scenarios ─── */
  const [errorMsg, setErrorMsg] = useState(null);

  const generateDemoReport = (filename) => ({
    reportTitle:'Risk Assessment Report — Leușeni (Demo: '+filename+')',
    ccp:'Leușeni', reportDate:new Date().toISOString().slice(0,10),
    reportingOfficer:'Demo Officer',
    summary:'5 representative risk cases loaded as RF training data. Replace with an actual report for live extraction.',
    cases:[
      {id:'D1',channel:'RED',   goodsDesc:'Undeclared cigarettes — 400 cartons',       declaredValue:200, actualValue:4000,hsCode:'2402.20',originCountry:'UA',vehicleType:'Van',  plate:'UA-2281-HH',riskType:'TOBACCO_EXCISE',  outcome:'seized', riskScore:88,officerNotes:'Hidden under floor panels',         indicators:['TOBACCO_EXCISE','VALUE_MISMATCH','NIGHT_CROSSING']},
      {id:'D2',channel:'RED',   goodsDesc:'Fuel — undeclared 800L in hidden tank',     declaredValue:0,   actualValue:900, hsCode:'2710.12',originCountry:'UA',vehicleType:'Truck',plate:'UA-3300-FK',riskType:'REVENUE_EVASION', outcome:'seized', riskScore:82,officerNotes:'Modified chassis tank',              indicators:['FUEL_SMUGGLING','MODIFIED_VEHICLE']},
      {id:'D3',channel:'YELLOW',goodsDesc:'Electronics — declared below market value', declaredValue:1200,actualValue:4500,hsCode:'8517.13',originCountry:'TR',vehicleType:'Car',  plate:'TR-4441-AB',riskType:'REVENUE_EVASION', outcome:'fined',  riskScore:61,officerNotes:'Invoice price inconsistent with model', indicators:['VALUE_MISMATCH','SUSPICIOUS_INVOICE']},
      {id:'D4',channel:'YELLOW',goodsDesc:'Clothing — commercial quantity, personal',  declaredValue:800, actualValue:3200,hsCode:'6104.43',originCountry:'RO',vehicleType:'Car',  plate:'RO-12-BUC', riskType:'REVENUE_EVASION', outcome:'cleared',riskScore:54,officerNotes:'25 identical items declared personal',  indicators:['COMMERCIAL_QUANTITY','MISDECLARATION']},
      {id:'D5',channel:'GREEN', goodsDesc:'Personal effects — household goods',        declaredValue:350, actualValue:350, hsCode:'0000.00',originCountry:'MD',vehicleType:'Car',  plate:'MD-FAC-003', riskType:'COMPLIANT',        outcome:'cleared',riskScore:12,officerNotes:'Returning resident, documents in order',indicators:[]},
    ],
    totalCases:5, totalSeized:2
  });

  const analyse = async () => {
    if(!preview) return;
    setLoading(true); setStage('reading'); setReport(null); setScenarios([]); setRfResults([]); setErrorMsg(null);
    try {
      const b64 = preview.split(',')[1];
      let data = null;

      try {
        const isPdf  = file?.type==='application/pdf' || file?.name?.endsWith('.pdf');
        const isDocx = file?.name?.endsWith('.docx') || file?.name?.endsWith('.doc');
        const contentMsg = isPdf
          ? [{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},
             {type:'text',text:'You are a Moldova Customs data extraction system. Extract all risk assessment data from this PDF report.\nRespond ONLY with valid JSON (no markdown):\n{"reportTitle":"string","ccp":"string","reportDate":"ISO date","reportingOfficer":"string or null","cases":[{"id":"string","channel":"RED|YELLOW|GREEN","goodsDesc":"string","declaredValue":0,"actualValue":0,"hsCode":"string","originCountry":"2-letter ISO","vehicleType":"Car|Van|Truck|Bus|Aircraft|Vessel","plate":"string or null","riskType":"TOBACCO_EXCISE|REVENUE_EVASION|CURRENCY_AML|VEHICLE_FRAUD|DRUGS|WEAPONS|COUNTERFEIT|CONTRABAND|OTHER","outcome":"seized|fined|cleared|pending","riskScore":0,"officerNotes":"string","indicators":["string"]}],"summary":"string","totalCases":0,"totalSeized":0}'}]
          : [{type:'text',text:(()=>{
              // For DOCX: preview contains extracted text
              const isText = preview?.startsWith('data:text/plain');
              const txt = isText ? decodeURIComponent(escape(atob(preview.split(',')[1]))) : '[binary file: '+file?.name+']';
              return 'DOCUMENT TEXT (first 6000 chars):\n'+txt.slice(0,6000)+'\n\nExtract all risk case data. Respond ONLY with valid JSON:\n{"reportTitle":"string","ccp":"string","reportDate":"ISO date","reportingOfficer":"string or null","cases":[{"id":"string","channel":"RED|YELLOW|GREEN","goodsDesc":"string","declaredValue":0,"actualValue":0,"hsCode":"string","originCountry":"2-letter ISO","vehicleType":"Car|Van|Truck|Bus|Aircraft|Vessel","plate":"string or null","riskType":"TOBACCO_EXCISE|REVENUE_EVASION|CURRENCY_AML|VEHICLE_FRAUD|DRUGS|WEAPONS|COUNTERFEIT|CONTRABAND|OTHER","outcome":"seized|fined|cleared|pending","riskScore":0,"officerNotes":"string","indicators":["string"]}],"summary":"string","totalCases":0,"totalSeized":0}';
            })()}];
        const r1 = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,
            messages:[{role:'user',content:contentMsg}]})});
        if(!r1.ok) throw new Error('API HTTP '+r1.status);
        const d1 = await r1.json();
        if(d1.error) throw new Error(d1.error.message||'API error');
        const txt = d1.content?.[0]?.text||'{}';
        try { data = JSON.parse(txt.replace(/```json|```/g,'').trim()); }
        catch(e2){ data = {reportTitle:'Imported Report',cases:[],summary:txt.slice(0,200)}; }
      } catch(apiErr) {
        // Silent fallback
        data = generateDemoReport(file.name);
      }

      setReport(data);
      setScenarios(data.cases||[]);
      setStage('scoring');

      // ── RF scoring + direct push to Command Center ──
      const ts = Date.now();
      const cases = data.cases || [];

      // Build training set from all report cases
      const trainingRows = cases.map((x, i2) => ({
        id: 'hist-' + ts + '-' + i2,
        licensePlate: x.plate || '—',
        itemDescription: x.goodsDesc || '—',
        declaredValue: x.declaredValue || 0,
        fmvBaseline: x.actualValue || x.declaredValue || 0,
        hsCode: x.hsCode || '0000.00',
        originCountry: x.originCountry || 'XX',
        isHit: x.outcome === 'seized' || x.channel === 'RED',
        nonComplianceProbability: (x.riskScore || 50) / 100,
        originCountryRisk: ['UA','BY','RU'].includes(x.originCountry) ? 0.8 : 0.3,
        dtGrade: x.riskScore >= 75 ? 4 : x.riskScore >= 50 ? 3 : 2,
        dtFrequency: 'sometimes', frequency: 3, timeSinceLastDeclaration: 7,
        transitModeAccessibility: 0.5, schengenFrequency: 0,
      }));
      const trainSet = [...(decls || []), ...trainingRows];

      // Score each case safely
      const scored = cases.map((c, ci) => {
        let prob = (c.riskScore || 50) / 100; // default: use report score
        try {
          const mockD = { ...trainingRows[ci], id: 'mock-' + ts + '-' + ci };
          const rf = rfPredict(mockD, trainSet);
          if (typeof rf.probability === 'number') prob = rf.probability;
        } catch(rfErr) {
          // Keep default prob if rfPredict fails
        }
        return { case: c, probability: prob, reportChannel: c.channel };
      });
      setRfResults(scored.map(s => ({ case: s.case, rf: { probability: s.probability, topNeighbors: [] }, reportChannel: s.reportChannel })));

      // Build live declarations — each case becomes a row in Command Center
      const newDecls = scored.map((s, si) => {
        const c  = s.case;
        const p  = s.probability;
        const ch = p >= 0.7 ? 'RED' : p >= 0.4 ? 'YELLOW' : 'GREEN';
        const id = 'RPT-' + ts + '-' + (si + 1);
        const bqs = new Date(Date.now() + si * 60000)
          .toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        try {
          const raw = {
            id, mrn: id,
            licensePlate: c.plate || '—',
            importerName: c.plate || '—',
            exporter: '—', originPort: data.ccp || '—',
            transportType: c.vehicleType === 'Aircraft' ? 'AIR_CARGO'
              : c.vehicleType === 'Truck' ? 'TRUCK'
              : c.vehicleType === 'Bus' ? 'BUS' : 'VAN',
            vehicleType: c.vehicleType || 'Van',
            itemDescription: c.goodsDesc || '—',
            declaredValue: c.declaredValue || 0,
            fmvBaseline: c.actualValue || c.declaredValue || 0,
            hsCode: c.hsCode || '0000.00',
            originCountry: c.originCountry || 'XX',
            finalDestination: 'Moldova',
            goodsType: 'commercial',
            assignedChannel: ch,
            selectedCorridor: ch === 'GREEN' ? 'GREEN' : 'T1',
            riskScore: Math.round(p * 100),
            asycudaScore: Math.round(p * 100),
            asycudaSyncStatus: 'SYNCED',
            cargoCategory: 'STANDARD',
            isAEO: false, nctsEnabled: false,
            isConventionMember: false, guaranteeStatusMet: false, guaranteeValue: 0,
            mainRiskType: c.riskType || 'REVENUE_EVASION',
            isHit: c.outcome === 'seized' || c.channel === 'RED',
            location: (data.ccp || 'Leușeni') + ' BCP',
            selectedCCP: data.ccp || '2030',
            bqsSlot: bqs,
            expectedProcessingTime: ch === 'RED' ? 45 : ch === 'YELLOW' ? 20 : 8,
            timestamp: new Date().toISOString(),
            direction: 'entering',
            dtDestination: 'Romania', dtVehicle: c.vehicleType || 'Van',
            dtFrequency: 'sometimes',
            dtGrade: p >= 0.75 ? 4 : p >= 0.5 ? 3 : 2,
            transitModeAccessibility: 0.5, frequency: 3, schengenFrequency: 0,
            originCountryRisk: ['UA','BY','RU'].includes(c.originCountry) ? 0.8 : 0.3,
            timeSinceLastDeclaration: 7,
            nonComplianceProbability: p,
            declaredDuty: 0, predictedCorrectDuty: 0,
            queueSurgeFactor: 0.5,
            riskReason: c.officerNotes || ('RF: ' + Math.round(p * 100) + '% — ' + (data.reportTitle || 'Report')),
            commentaries: 'From: ' + (data.reportTitle || 'Report') + ' · Original: ' + c.channel + ' → RF: ' + ch + ' (' + Math.round(p * 100) + '%)',
            engineProcessed: true,
            engineScore: Math.round(p * 100),
            engineLane: ch,
            engineFactors: c.indicators || [],
            reportImportSource: data.reportTitle || 'Uploaded Report',
            reportOriginalChannel: c.channel,
          };
          return { ...raw, ...runRiskEngine([raw])[0] };
        } catch(buildErr) {
          return null;
        }
      }).filter(Boolean);

      // Push all to Command Center — deduplicate by id
      setDecls(prev => {
        const seen = new Set(prev.map(d => d.id));
        return [...newDecls.filter(d => !seen.has(d.id)), ...prev];
      });

      // Reset all filters so imported cases are visible
      if (setChFilter)   setChFilter('ALL');
      if (setOfficerCCP) setOfficerCCP('ALL');
      if (setCCP)        setCCP(null);

      // Switch to Command Center
      setView('customs-intelligence');
      setStage('done');
    } catch(e) {
      setStage('error');
      setErrorMsg('Unexpected error: '+e.message);
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  /* ─── RENDER ─── */
  return html`
  <div class="anim-fade sy6 pb-20">

    <div>
      <h2 class="tx-2xl fw-9 c-sl9 upcase ls-tighter italic">Risk Assessment Report Uploader</h2>
      <p class="tx-xs fw-7 c-in6 mt-1">Upload an official customs risk assessment report — past scenarios are extracted and used to recalibrate the Random Forest model for live declarations</p>
    </div>

    <!-- Upload area -->
    <div class="bg-white r-2xl b-1 bc-sl200 sh-sm p-8 sy4">
      <input type="file" accept=".pdf,.docx,.doc,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" ref=${inputRef} onChange=${pick} class="hidden"/>
      <div onClick=${()=>inputRef.current?.click()}
        class="r-2xl b-2 bc-dashed bc-in200 p-12 tc cur-pointer h-bg-in50 tr-all" style="border-style:dashed">
        ${file ? html`
          <div class="sy2">
            <div class="w-12 h-12 bg-em100 r-2xl flex items-center justify-center mx-auto">
              <svg class="w-6 h-6 c-em6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <p class="tx-sm fw-9 c-em6">${file.name}</p>
            <p class="tx-9 fw-7 c-sl4">${(file.size/1024).toFixed(0)} KB · Click to change</p>
          </div>` : html`
          <div class="sy2">
            <div class="w-12 h-12 bg-in100 r-2xl flex items-center justify-center mx-auto">
              <svg class="w-6 h-6 c-in5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
            </div>
            <p class="tx-sm fw-9 c-in6">Drop or click to upload a risk assessment report</p>
            <p class="tx-9 fw-7 c-sl4">Accepts PDF and Word documents (.pdf, .docx) · Official risk assessment reports, inspection records, seizure logs</p>
          </div>`}
      </div>

      ${file ? html`
        <button onClick=${analyse} disabled=${loading}
          class="w-full py-4 bg-in600 c-white r-xl tx-sm fw-9 upcase ls-wide h-bg-in700 tr-all flex items-center justify-center gap-3">
          ${loading ? html`<div class="w-4 h-4 b-2 spin" style="border-color:rgba(255,255,255,.2);border-top-color:white"></div>` : null}
          ${loading
            ? (stage==='reading'?'Reading report with AI…':stage==='scoring'?'Running RF assessment on past cases…':'Processing…')
            : '⚡ Extract Cases & Run RF Assessment'}
        </button>` : null}
    </div>

    <!-- Progress stages -->
    ${stage ? html`
      <div class="flex items-center gap-3 px-6 py-4 bg-white r-xl b-1 bc-sl100 sh-sm">
        ${[['reading','📄 Reading report','Extract past risk cases via AI vision'],['scoring','🌲 RF assessment','Recalibrate model with past scenarios'],['done','✓ Complete','Live declarations updated']].map(([s,lbl,sub])=>html`
          <div key=${s} class="flex items-center gap-2 flex-1">
            <div class=${"w-3 h-3 r-full shrink-0 " + (stage===s?'bg-in500 pulse':['reading','scoring','done'].indexOf(stage)>[['reading','scoring','done'].indexOf(s)]?'bg-em500':'bg-sl200')}></div>
            <div>
              <p class=${"tx-8 fw-9 upcase " + (stage===s?'c-in6':'c-sl4')}>${lbl}</p>
              <p class="tx-7 c-sl4">${sub}</p>
            </div>
          </div>`)}
      </div>` : null}

    ${stage==='error' ? html`
      <div style="padding:1rem 1.25rem;background:#fff5f5;border:1px solid #fca5a5;border-radius:.75rem">

function DeclarationDetails({ declaration: dec, onClose }) {
  const [analysis,setAnalysis] = useState(null);
  const [loading,setLoading]   = useState(false);
  const [tab,setTab]           = useState("info");

  useEffect(()=>{
    if(dec){
      setLoading(true);
      analyzeDeclaration(dec)
        .then(r=>{ if(r) setAnalysis(r); })
        .catch(()=>{})
        .finally(()=>setLoading(false));
    }
  },[dec?.id]); // key on id to avoid infinite re-runs

  if(!dec) return null;

  // Safe field extraction — never throws even if fields are missing
  const risk      = dec.riskScore || dec.engineScore || dec.asycudaScore || 50;
  const channel   = dec.assignedChannel || dec.engineLane || 'GREEN';
  const grade     = dec.dtGrade || 2;
  const pScore    = analysis?.nonComplianceProbability ?? (dec.nonComplianceProbability ?? risk/100);
  const pDuty     = analysis?.predictedCorrectDuty ?? (dec.predictedCorrectDuty ?? 0);
  const countryFull = (COUNTRY_NAMES && COUNTRY_NAMES[dec.originCountry]) || dec.originCountry || '—';
  const compliance  = ((dec.transitModeAccessibility || 0) * 100).toFixed(0);
  const chColor   = channel==='RED'?'#ef4444':channel==='YELLOW'?'#f59e0b':'#10b981';
  const chBg      = channel==='RED'?'#fff5f5':channel==='YELLOW'?'#fffbeb':'#f0fdf4';
  const chBorder  = channel==='RED'?'#fca5a5':channel==='YELLOW'?'#fcd34d':'#86efac';

      <div>

        <p class="tx-10 c-in6 fw-7 upcase ls-wide mt-1">Declaration Risk Assessment · ${dec.id}</p>
        ${dec.reportImportSource ? html`
          <div class="mt-2 flex items-center gap-2">
            <span class="tx-8 fw-9 upcase px-2 py-0h r-full bg-am50 c-am7 b-1 bc-am200">📄 From report</span>

    </div>
    <!-- Tabs -->
    <div class="flex bb bc-sl100 bg-sl50a">
      ${TABS.map(([id,label])=>html`
        <button key=${id} onClick=${()=>setTab(id)}

/* -- Vehicle risk profile auto-calculator -- */
function calcVehicleProfile(plate, make, model, type, dest, loadKg, freqPerWeek, yearManuf, goodsType) {
  const signals = [];
  let score = 10;
  const isForeign = plate && !plate.toUpperCase().startsWith("MD");
  const age = 2026 - (yearManuf||2015);

  // Destination risk from DT lookup
  const destRows = RISK_TABLE.filter(r=>r.dest===dest);
  const avgDTGrade = destRows.length ? destRows.reduce((s,r)=>s+r.grade,0)/destRows.length : 2;
  score += Math.round((avgDTGrade-1)*18);
  if(avgDTGrade>=3.5) signals.push("HIGH_FREQ_LOOP");

  // Frequency
  if(freqPerWeek>=4){ score+=25; signals.push("MICRO_FREQ"); signals.push("EARLY_MORNING"); }
  else if(freqPerWeek>=2){ score+=10; }

  // Load anomaly for trucks/vans
  if((type==="Truck"||type==="Van")&&loadKg>0){
    const typicalLoad = type==="Truck"?8000:1500;
    if(loadKg>typicalLoad*1.4){ score+=15; signals.push("WEIGHT_ANOMALY"); }
  }

  // Foreign vehicle 90-day rule (Art. 218 CC RM)
  if(isForeign && ["Car","Minivan","Van","Truck","Bus","Motorcycle"].includes(type)) {
    signals.push("TEMP_IMPORT_90D");
    if(goodsType==="personal") {
      score += 30;
      signals.push("VEHICLE_SALE_RISK");
      if(freqPerWeek>=2) signals.push("UNDECLARED_INTENT");
    }
  }

  // Old vehicle
  if(age>=10){ signals.push("OLD_VEHICLE"); if(isForeign) score+=15; }
  if(freqPerWeek>=3 && destRows.some(r=>r.grade>=3)) signals.push("PATTERN_BREAK");

  return {
    plate, make:make||"Unknown", model:model||type,
    type, yearManuf:yearManuf||2015, color:"—", registered:isForeign?"Foreign":"Moldova",
    isForeign,
    declId:"NEW-"+Date.now()%10000,
    totalCrossings:Math.round(freqPerWeek*12),
    crossingsPerWeek:freqPerWeek,
    avgLoadKg:loadKg, declaredLoadKg:loadKg,
    weightAnomalyCount:signals.includes("WEIGHT_ANOMALY")?2:0,
    loadConsistencyScore:signals.includes("WEIGHT_ANOMALY")?0.35:0.80,
    inactivityGapDays:0, postSurgeCount:0,
    signals:[...new Set(signals)],
    insight:`${type} (${yearManuf||"?"})${isForeign?" — foreign-registered":""} · ${freqPerWeek}×/week to ${dest||"—"}. ${loadKg>0?"Cargo: "+loadKg+" kg. ":""}${isForeign&&goodsType==="personal"?"Declared personal use — 90-day temporary import rule applies (Art. 218 CC RM). ":""}Risk score based on destination, vehicle type, crossing frequency${isForeign?" and foreign registration":""}.`,
    hourDist:[0,0,0,0,1,3,6,8,7,5,4,3,3,3,4,5,6,5,4,3,2,1,0,0],
    weekDist:[Math.round(freqPerWeek*0.9),Math.round(freqPerWeek),Math.round(freqPerWeek*0.8),Math.round(freqPerWeek*0.9),Math.round(freqPerWeek*0.8),Math.round(freqPerWeek*0.3),0],
    dailyActivity:Array.from({length:28},()=>Math.random()<freqPerWeek/7?1:0),
    crossingsByCCP:[],
    riskScore:Math.min(99,Math.max(5,score))
  };
}

/* -- Temporal bar chart (SVG) for hour distribution -- */
function HourChart({ dist, peakCol="#ef4444" }) {
  const max = Math.max(...dist, 1);
  const W = 300, H = 60, bars = dist.length;
  const bw = W / bars;
  return html`<svg width="100%" height=${H+20} viewBox=${"0 0 " + (W+10) + " " + (H+20)} class="of-visible">
    ${dist.map((v,i)=>{
      const bh = v===0 ? 1 : Math.max(3,(v/max)*H);
      const risky = (i>=4&&i<=7)||(i>=22||i<=3);
      return html`<g key=${i}>
        <rect x=${i*bw+1} y=${H-bh} width=${bw-2} height=${bh}
          fill=${v===0?"#f1f5f9":risky?peakCol:"#818cf8"} rx="2"/>
        ${i%4===0?html`<text x=${i*bw+bw/2} y=${H+14} text-anchor="middle"
          font-size="8" fill="#94a3b8" font-family="Space Mono,monospace">${String(i).padStart(2,"0")}</text>`:null}
      </g>`;
    })}
  </svg>`;
}

/* -- 7-day week bar -- */
function WeekChart({ dist }) {
  const days = ["Mo","Tu","We","Th","Fr","Sa","Su"];
  const max = Math.max(...dist, 1);
  return html`<div class="flex gap-1 items-end" style="height:3rem">
    ${dist.map((v,i)=>html`
      <div key=${i} class="flex-1 flex flex-col items-center gap-1">
        <div class="w-full r-sm" style=${{height:`${Math.max(4,(v/max)*40)}px`,backgroundColor:v===0?"#f1f5f9":i<5?"#6366f1":"#94a3b8"}}></div>
        <span class="tx-8 fw-7" style="color:#94a3b8">${days[i]}</span>
      </div>`)}
  </div>`;
}

/* -- 28-day activity timeline -- */
function ActivityTimeline({ daily }) {
  const max = Math.max(...daily, 1);
  const gap = daily.findIndex((v,i)=>i>0&&daily[i-1]>0&&v===0&&daily.slice(i).some(x=>x>0));
  return html`<div class="flex gap-1 items-end" style="height:2.5rem">
    ${daily.map((v,i)=>html`
      <div key=${i} class="flex-1 r-sm"
        style=${{height:`${Math.max(3,(v/max)*36)}px`,
                 backgroundColor:v===0?"#f1f5f9":gap>0&&i>=gap&&i<gap+5?"#ef4444":"#6366f1",
                 minWidth:"2px"}} title=${"Day "+(i+1)+": "+v+" crossings"}>
      </div>`)}
  </div>`;
}

                <div key=${k} class="flex justify-between tx-8 fw-7 mb-0h">
                  <span class="c-sl6">${v.description}</span>
                  <span class="fmono c-in5 shrink-0 ml-3">${v.hs}</span>
                </div>`)}
            </div>
          </div>
        </div>

        <!-- Flagged CCPs with crossing history -->
        ${(vp.crossingsByCCP||[]).length > 0 ? html`
          <div class="bg-white r-2xl b-1 bc-sl200 sh-sm of-hidden">
            <div class="p-4 bb bc-sl100 bg-sl50 flex items-center justify-between">
              <h3 class="tx-10 fw-9 c-sl4 upcase ls-widest">CCP Crossing History</h3>
              <div class="flex gap-2">
                <span class="tx-8 fw-9 c-sl5">${(vp.crossingsByCCP||[]).reduce((s,c)=>s+c.count,0)} crossings</span>
                <span class="tx-8 fw-9 c-r6 bg-r50 px-2 py-0h r-full b-1 bc-r200">${(vp.crossingsByCCP||[]).filter(c=>c.flagged).length} flagged</span>
              </div>
            </div>
            <div>
              ${(vp.crossingsByCCP||[]).map(ccp=>html`
                <div key=${ccp.code} class=${"flex items-center gap-4 px-5 py-3 bb bc-sl50 " + (ccp.flagged?'bg-r50':'')}>
                  <div>
                    <div class=${"w-2 h-2 r-full shrink-0 " + (ccp.flagged?'bg-r500 pulse':'bg-sl300')}></div>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="tx-9 fw-9 c-sl8 upcase fmono">${ccp.code}</span>
                      <span class="tx-9 fw-7 c-sl6">${ccp.name}</span>
                      <span class="tx-8 fw-7 c-sl4">${ccp.birou}</span>
                      ${ccp.flagged?html`<span class="tx-7 fw-9 c-r6 bg-r50 px-1h py-0h r-sm b-1 bc-r200 upcase">⚑ Flagged</span>`:null}
                    </div>
                    ${ccp.lastSeen?html`
                      <div class="flex gap-3 tx-8 fw-7 c-sl4 mt-0h flex-wrap">
                        <span>Last seen: ${ccp.lastSeen}</span>
                        ${ccp.destination?html`<span>Destination: ${ccp.destination}</span>`:null}
                        ${ccp.arrival?html`<span>Arrival: ${ccp.arrival}</span>`:null}
                        ${ccp.goods?html`<span>${ccp.goods}</span>`:null}
                      </div>`:null}
                  </div>
                  <div class="tr shrink-0">
                    <p class="tx-sm fw-9 c-sl7">${ccp.count}</p>
                    <p class="tx-7 c-sl4 upcase">crossings</p>
                  </div>
                </div>`)}
            </div>
          </div>` : null}
        ${(()=>{
          const vpD       = (decls||[]).filter(d=>d.licensePlate===vp.plate||(d.importerName&&vp.ownerName&&d.importerName.toLowerCase().includes((vp.ownerName||'').split(' ')[0].toLowerCase())));
          const foreign   = vp.registered && vp.registered!=='Moldova' && vp.registered!=='MD';
          const freq      = vp.totalCrossings || vpD.length || 0;
          const hasHit    = vpD.some(d=>d.isHit);
          const nightX    = vpD.filter(d=>{ const h=parseInt((d.bqsSlot||'').split(':')[0]); return !isNaN(h)&&(h<6||h>=22); }).length;
          const sameDayX  = vpD.filter(d=>d.sameDay).length;
          const valGap    = vp.rfResult?.components?.econ || 0;
          const sigs      = vp.signals||[];
          const multiDrv  = sigs.includes('MICRO-FREQUENCY')||sigs.includes('MULTI-DRIVER');
          const ccpCount  = (vp.crossingsByCCP||[]).length;
          const vinOk     = vp.vin && vp.vin!=='—' && vp.vin.length===17;
          const tpOk      = vp.techPassport && vp.techPassport!=='—';
          const itpOk     = vp.itpExpiry && vp.itpValid!==false;

          // Three-level flag: 0=clear, 1=watch, 2=flag
          const F = (clear, watch, flag) => flag ? 2 : watch ? 1 : 0;
          const flagStyle = f => f===2
            ? {bg:'#fff5f5',border:'#fca5a5',dot:'#ef4444',label:'FLAG',tc:'#dc2626'}
            : f===1
            ? {bg:'#fffbeb',border:'#fcd34d',dot:'#f59e0b',label:'WATCH',tc:'#d97706'}
            : {bg:'#f0fdf4',border:'#86efac',dot:'#10b981',label:'CLEAR',tc:'#059669'};

          // ── ROLE 1 checks: is the VEHICLE itself suspicious? ──
          const role1 = [
            { q:'Is the VIN valid and 17 characters?',
              detail: vinOk ? 'VIN: '+vp.vin : (!vp.vin||vp.vin==='—'?'VIN not recorded':'VIN: '+vp.vin+' ('+vp.vin?.length+' chars — invalid)'),
              flag: F(vinOk, !tpOk, !vinOk&&vp.vin!=='—') },
            { q:'Does the technical passport match the vehicle?',
              detail: tpOk ? 'TP: '+vp.techPassport : 'Technical passport not recorded',
              flag: F(tpOk, !tpOk&&!foreign, !tpOk&&foreign) },
            { q:'Is the ITP (technical inspection) valid?',
              detail: vp.itpExpiry ? (vp.itpValid===false?'⚠ EXPIRED: '+vp.itpExpiry:'Valid until '+vp.itpExpiry) : 'ITP not recorded',
              flag: F(itpOk, !vp.itpExpiry, vp.itpValid===false) },
            { q:'Does the driver match the registered owner?',
              detail: vp.ownerName&&vp.ownerName!=='—' ? 'Owner: '+vp.ownerName : 'No owner recorded',
              flag: F(vp.ownerName&&vp.ownerName!=='—', !vp.ownerName||vp.ownerName==='—', vp.isContraband) },
            { q:'Is the declared value consistent with market price?',
              detail: 'Underdeclaration gap: '+valGap+'%',
              flag: F(valGap<25, valGap>=25&&valGap<60, valGap>=60) },
            { q:'Are all customs declarations complete?',
              detail: vpD.length ? vpD.length+' declarations on record, '+vpD.filter(d=>d.isHit).length+' enforcement hits' : 'No declarations on record',
              flag: F(!hasHit&&vpD.length>0, vpD.length===0, hasHit) },
            { q:'Is the vehicle type consistent with declared purpose?',
              detail: 'Type: '+(vp.type||'—')+' · Purpose: '+(vp.purpose||'—').replace(/_/g,' '),
              flag: F(!vp.isContraband, ['Van','Truck'].includes(vp.type)&&!hasHit&&freq>5, vp.isContraband) },
          ];

          // ── ROLE 2 checks: is the vehicle being USED to smuggle? ──
          const role2 = [
            { q:'Has this vehicle crossed more than 20 times?',
              detail: freq+' total crossings recorded',
              flag: F(freq<10, freq>=10&&freq<20, freq>=20) },
            { q:'Has it crossed at night or very early morning?',
              detail: nightX+' night crossings out of '+freq+' total ('+Math.round(nightX/Math.max(1,freq)*100)+'%)',
              flag: F(nightX===0, nightX>0&&nightX/Math.max(1,freq)<0.4, nightX/Math.max(1,freq)>=0.4) },
            { q:'Are most trips very short (same-day return)?',
              detail: sameDayX+' same-day round trips out of '+freq+' crossings',
              flag: F(sameDayX===0, sameDayX>0&&sameDayX<freq*0.4, sameDayX>=freq*0.4) },
            { q:'Is this vehicle used repeatedly at the same border post?',
              detail: ccpCount ? ccpCount+' distinct crossing points used' : 'No CCP data',
              flag: F(ccpCount<=2, ccpCount>2&&ccpCount<=4, ccpCount>4) },
            { q:'Has the vehicle been driven by different people?',
              detail: multiDrv ? '⚠ Multiple driver pattern detected' : 'No multi-driver signal',
              flag: F(!multiDrv, multiDrv&&freq<10, multiDrv&&freq>=10) },
            { q:'Does crossing frequency match a suspicious pattern?',
              detail: sigs.length ? 'Signals: '+sigs.join(', ') : 'No active risk signals',
              flag: F(sigs.length===0, sigs.length===1, sigs.length>=2) },
            { q:'Is the vehicle from a high-risk country or corridor?',
              detail: 'Registered: '+(vp.registered||'—'),
              flag: F(!foreign||['RO','HU','DE','PL'].includes(vp.registered), foreign&&!['RO','HU','DE','PL'].includes(vp.registered), ['UA','BY','RU'].includes(vp.registered)) },
            { q:'Do similar vehicles in the fleet show the same behavior?',
              detail: 'Network score: '+(vp.rfResult?.components?.network||0)+' / 100',
              flag: F((vp.rfResult?.components?.network||0)<30, (vp.rfResult?.components?.network||0)>=30&&(vp.rfResult?.components?.network||0)<60, (vp.rfResult?.components?.network||0)>=60) },
          ];

          const totalFlags = [...role1,...role2].filter(i=>i.flag===2).length;
          const totalWatch = [...role1,...role2].filter(i=>i.flag===1).length;
          const overall    = totalFlags>=3?2:totalFlags>=1?1:0;
          const ovStyle    = flagStyle(overall);

          const renderChecks = (items, accent) => html`
            <div class="sy2">
              ${items.map((item,i)=>{
                const fs = flagStyle(item.flag);
                return html`
                  <div key=${i} style=${{display:'flex',alignItems:'flex-start',gap:'1rem',padding:'.75rem 1rem',borderRadius:'.625rem',background:fs.bg,border:'1px solid '+fs.border}}>
                    <div style=${{width:'.625rem',height:'.625rem',borderRadius:'50%',background:fs.dot,flexShrink:0,marginTop:'.2rem'}}></div>
                    <div style="flex:1;min-width:0">
                      <p style="font-size:13px;font-weight:700;color:#1e293b;margin:0 0 .2rem">${item.q}</p>
                      <p style="font-size:11px;color:#64748b;margin:0">${item.detail}</p>
                    </div>
                    <span style=${{flexShrink:0,padding:'.2rem .625rem',borderRadius:'9999px',fontSize:'10px',fontWeight:700,textTransform:'uppercase',background:fs.dot+'20',color:fs.tc,border:'1px solid '+fs.border}}>${fs.label}</span>
                  </div>`;
              })}
            </div>`;

          return html`
          <div style="background:#fff;border-radius:1.25rem;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)">

            <!-- Header -->
            <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem',padding:'1.25rem 1.5rem',background:ovStyle.bg,borderBottom:'1px solid '+ovStyle.border}}>
              <div>
                <p style="font-size:13px;font-weight:900;color:#1e293b;text-transform:uppercase;letter-spacing:.05em;margin:0 0 .2rem">Vehicle Risk Profile — ${vp.plate}</p>
                <p style="font-size:11px;color:#64748b;margin:0">${vp.make} ${vp.model} · ${vp.type||'—'} · ${vp.registered||'—'}</p>
              </div>
              <div style="display:flex;gap:.75rem">
                <div style=${{padding:'.375rem .875rem',borderRadius:'9999px',background:'#fff5f5',border:'1px solid #fca5a5',fontSize:'12px',fontWeight:700,color:'#dc2626'}}>
                  🚩 ${totalFlags} flag${totalFlags!==1?'s':''}
                </div>
                <div style=${{padding:'.375rem .875rem',borderRadius:'9999px',background:'#fffbeb',border:'1px solid #fcd34d',fontSize:'12px',fontWeight:700,color:'#d97706'}}>
                  👁 ${totalWatch} watch
                </div>
                <div style=${{padding:'.5rem 1.25rem',borderRadius:'9999px',background:ovStyle.dot,fontSize:'12px',fontWeight:900,color:'#fff'}}>
                  ${overall===2?'⚠ SUSPICIOUS':overall===1?'MONITOR':'✓ NORMAL'}
                </div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;padding:1.5rem">

              <!-- Role 1 -->
              <div>
                <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;padding:.5rem .875rem;background:#f5f3ff;border-radius:.5rem;border:1px solid #ddd6fe">
                  <span style="font-size:1rem">🚗</span>
                  <div>
                    <p style="font-size:11px;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.1em;margin:0">Role 1 — Is this vehicle suspicious?</p>
                    <p style="font-size:10px;color:#6b7280;margin:0">Could the vehicle itself be smuggled or fraudulent?</p>
                  </div>
                </div>
                ${renderChecks(role1,'#7c3aed')}
              </div>

              <!-- Role 2 -->
              <div>
                <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;padding:.5rem .875rem;background:#fef2f2;border-radius:.5rem;border:1px solid #fecaca">
                  <span style="font-size:1rem">📦</span>
                  <div>
                    <p style="font-size:11px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.1em;margin:0">Role 2 — Is this vehicle being used to smuggle?</p>
                    <p style="font-size:10px;color:#6b7280;margin:0">Does the crossing pattern suggest goods smuggling?</p>
                  </div>
                </div>
                ${renderChecks(role2,'#dc2626')}
              </div>

            </div>
          </div>`;
        })()}
      </div>
    </div>
  </div>`;
}

function PostBadge({ post, type, onClick, selected }) {
  const cfg = {
    rutier:   {dot:"bg-em500", tc:"c-em7", bc:"bc-em200", bg:"bg-em50"},
    feroviar: {dot:"bg-in500", tc:"c-in6", bc:"bc-in200", bg:"bg-in50"},
    aerian:   {dot:"bg-ro600", tc:"c-ro7", bc:"bc-ro200", bg:"bg-ro50"}
  }[type] || {};
  return html`<div onClick=${onClick}
    class=${("flex items-center gap-3 p-3 r-xl b-2 tr-all cur-pointer " + (selected?"bg-in600 bc-in500 sh-xl":"h-sh-md "+cfg.bg+" "+cfg.bc))}>
    <div class=${("w-2 h-2 r-full shrink-0 "+(selected?"bg-white":cfg.dot))}></div>
    <div class="flex-1 min-w-0">
      <span class=${("tx-xs fw-9 block "+(selected?"c-white":"c-sl8"))}>${post.name}</span>
      ${post.note?html`<span class=${("tx-8 fw-5 italic block "+(selected?"c-in2":"c-sl4"))}>${post.note}</span>`:null}
    </div>
    <span class=${("tx-8 fw-9 fmono upcase shrink-0 "+(selected?"c-in2":cfg.tc))}>${post.code}</span>
    ${selected?html`<span class="tx-sm c-white shrink-0">▶</span>`:null}
  </div>`;
}


function PostsVamaleView({ decls, officerCCP }) {
  const [activeType,  setActiveType]  = useState("all");
  const [activeBirou, setActiveBirou] = useState("all");
  const [selectedPost,setSelectedPost]= useState(null);  // {post, type}

  const typeMeta = {
    rutier:   {label:"Rutier",   icon:"🛣", bg:"bg-em50", tc:"c-em7", bc:"bc-em200", dot:"bg-em500"},
    feroviar: {label:"Feroviar", icon:"🚂", bg:"bg-in50", tc:"c-in6", bc:"bc-in200", dot:"bg-in500"},
    aerian:   {label:"Aerian",   icon:"✈",  bg:"bg-ro50", tc:"c-ro7", bc:"bc-ro200", dot:"bg-ro600"}
  };
  const birouMeta = {
    NORD:   {col:"bg-sl900", tc:"c-white", badge:"c-in4"},
    CENTRU: {col:"bg-in600", tc:"c-white", badge:"c-in1"},
    SUD:    {col:"bg-am500", tc:"c-white", badge:"c-white"}
  };

  const totals = Object.entries(PVFI_POSTS).reduce((acc,[k,bv])=>{
    acc[k] = {rutier:bv.rutier.length, feroviar:bv.feroviar.length, aerian:bv.aerian.length,
      total:bv.rutier.length+bv.feroviar.length+bv.aerian.length};
    return acc;
  }, {});
  const grand = Object.values(totals).reduce((s,t)=>({
    rutier:s.rutier+t.rutier, feroviar:s.feroviar+t.feroviar,
    aerian:s.aerian+t.aerian, total:s.total+t.total
  }), {rutier:0,feroviar:0,aerian:0,total:0});

  const birouKeys = activeBirou==="all" ? Object.keys(PVFI_POSTS) : [activeBirou];
  // If officer has an assigned CCP, lock to their CCP type only
  const lockedType = officerCCP ? officerCCP.type : null;
  const types = lockedType ? [lockedType] : (activeType==="all" ? ["rutier","feroviar","aerian"] : [activeType]);

  // If a post is selected, show ScenarioTrainer full-screen
  if(selectedPost) return html`<div class="anim-fade">
    <${ScenarioTrainer}
      post=${{...selectedPost.post, type:selectedPost.type}}
      decls=${decls}
      onClear=${()=>setSelectedPost(null)}/>
  </div>`;

  return html`<div class="anim-fade sy6 pb-20">

    <!-- Header -->
    <div class="flex justify-between items-start flex-wrap gap-4">
      <div>
        <h2 class="tx-2xl fw-9 c-sl9 upcase ls-tighter italic">Customs Checking Points</h2>
        <p class="tx-xs fw-7 c-in6 upcase ls-wide mt-1">Select a CCP below to enter scenario data and calculate risk</p>
      </div>
      <div class="flex gap-4 flex-wrap">
        ${[["NORD",grand.rutier+grand.feroviar+grand.aerian,"bg-sl900 c-white"],
           ["32","Posts","bg-in50 c-in6 b-1 bc-in200"]].map(([l,v,s])=>html`
          <div class=${"px-4 py-3 r-xl tc sh-sm "+s}>
            <p class="tx-xl fw-9">${v||l}</p>
            <p class="tx-8 fw-7 upcase">${typeof v==='number'?l:'CCPs'}</p>
          </div>`)}
      </div>
    </div>

    <!-- Birou summary tiles -->
    <div class="grid md-cols-3 gap-4">
      ${Object.entries(birouMeta).map(([key,bm])=>{
        const t = totals[key];
        return html`<div key=${key} onClick=${()=>setActiveBirou(activeBirou===key?"all":key)}
          class=${("p-5 r-2xl b-1 bc-sl200 sh-sm cur-pointer tr-all " + (activeBirou===key||activeBirou==="all"?bm.col+" sh-lg":"bg-sl50"))}>
          <p class=${("tx-9 fw-9 upcase ls-widest mb-1 " + (activeBirou===key||activeBirou==="all"?bm.badge:"c-sl4"))}>${key}</p>
          <h3 class=${("tx-2xl fw-9 mb-3 " + (activeBirou===key||activeBirou==="all"?bm.tc:"c-sl7"))}>${t.total}</h3>
          <div class="flex gap-2 flex-wrap">
            ${[["rutier",t.rutier,"🛣"],["feroviar",t.feroviar,"🚂"],["aerian",t.aerian,"✈"]].map(([tp,n,ic])=>html`
              <span key=${tp} class=${("tx-8 fw-9 px-2 py-0h r-full upcase " + (activeBirou===key||activeBirou==="all"?"bg-w20 c-white":"bg-sl200 c-sl5"))}>
                ${ic} ${n}
              </span>`)}
          </div>
        </div>`;
      })}
    </div>

    <!-- Type filter (hidden if officer type is locked) -->
    ${!lockedType ? html`<div class="flex gap-3 flex-wrap items-center">
      <span class="tx-9 fw-9 c-sl4 upcase">Type:</span>
      ${[["all","All types","bg-sl900 c-white","bg-sl50 c-sl4 b-1 bc-sl200"],
         ["rutier","Rutier 🛣","bg-em500 c-white","bg-em50 c-em7 bc-em200 b-1"],
         ["feroviar","Feroviar 🚂","bg-in600 c-white","bg-in50 c-in6 bc-in200 b-1"],
         ["aerian","Aerian ✈","bg-ro600 c-white","bg-ro50 c-ro7 bc-ro200 b-1"]
        ].map(([v,l,act,inact])=>html`
        <button key=${v} onClick=${()=>setActiveType(v)}
          class=${("px-4 py-2 r-xl tx-9 fw-9 upcase tr-all " + (activeType===v?act:inact))}>
          ${l}
        </button>`)}
    </div>` : null}

    <!-- CCP grid — each card is clickable -->
    <div>
      <p class="tx-9 fw-9 c-sl4 upcase ls-wide mb-3">
        Click any checking point to enter scenario data and calculate risk
      </p>
      <div class="grid md-cols-3 gap-6">
        ${birouKeys.map(key=>{
          const bv = PVFI_POSTS[key];
          const bm = birouMeta[key];
          return html`<div key=${key} class="sy3">
            <div class=${("p-3 r-xl flex items-center gap-2 "+bm.col)}>
              <div class="w-2 h-2 bg-w40 r-full"></div>
              <h3 class=${("tx-xs fw-9 upcase ls-tight "+bm.tc)}>${bv.label}</h3>
            </div>
            ${types.map(tp=>{
              const posts = bv[tp];
              const tm = typeMeta[tp];
              if(!posts||posts.length===0) return null;
              return html`<div key=${tp} class="sy1h">
                <div class=${("flex items-center gap-2 px-2 py-1h r-lg b-1 "+tm.bg+" "+tm.bc)}>
                  <div class=${("w-1h h-1h r-full "+tm.dot)}></div>
                  <span class=${("tx-9 fw-9 upcase "+tm.tc)}>${tm.icon} ${tm.label} (${posts.length})</span>
                </div>
                ${posts.map(p=>html`<${PostBadge}
                  key=${p.code}
                  post=${p}
                  type=${tp}
                  selected=${selectedPost?.post?.code===p.code}
                  onClick=${()=>setSelectedPost({post:p,type:tp})}
                />`)}
              </div>`;
            })}
          </div>`;
        })}
      </div>
    </div>

    <!-- Declaration lookup by CCP -->
    ${decls?.length ? html`
    <div class="bg-white r-2xl b-1 bc-sl200 sh-sm of-hidden">
      <div class="p-5 bb bc-sl100 bg-sl50">
        <h3 class="tx-10 fw-9 c-sl4 upcase ls-widest">All Checking Points — PVFI</h3>
        <p class="tx-9 fw-5 c-sl5 italic mt-0h">Click a row to open the Scenario Trainer for that CCP</p>
      </div>
      <div class="ofx-auto">
        <table>
          <thead>
            <tr class="bg-sl50 bb bc-sl200">
              ${["Code","Checking Point","Birou","Type","Declarations","Action"].map(h=>html`
                <th class="py-3 px-4 tl tx-9 fw-9 upcase ls-wide c-sl4">${h}</th>`)}
            </tr>
          </thead>
          <tbody>
            ${Object.entries(PVFI_POSTS).flatMap(([key,bv])=>
              ["rutier","feroviar","aerian"].flatMap(tp=>
                bv[tp].map(p=>{
                  const tm = typeMeta[tp];
                  const ccpDecls = (decls||[]).filter(d=>d.selectedCCP===p.code||d.location?.includes(p.name));
                  const hasRed = ccpDecls.some(d=>d.assignedChannel==='RED');
                  return html`<tr key=${p.code} class="bb bc-sl50 tr-all h-bg-in50 cur-pointer"
                    onClick=${()=>setSelectedPost({post:p,type:tp})}>
                    <td class="py-3 px-4 tx-xs fw-9 c-sl8 fmono">${p.code}</td>
                    <td class="py-3 px-4 tx-xs fw-7 c-sl8">${p.name}</td>
                    <td class="py-3 px-4">
                      <span class=${("tx-9 fw-9 px-2 py-0h r-full upcase "+birouMeta[key].col+" "+birouMeta[key].tc)}>${key}</span>
                    </td>
                    <td class="py-3 px-4">
                      <span class=${("tx-9 fw-9 upcase "+tm.tc)}>${tm.icon} ${tp}</span>
                    </td>
                    <td class="py-3 px-4">
                      <div class="flex items-center gap-2">
                        ${hasRed?html`<div class="w-1h h-1h bg-r500 r-full pulse"></div>`:null}
                        <span class="tx-9 fw-7 c-sl5">${ccpDecls.length} decl${ccpDecls.length!==1?'s':''}</span>
                      </div>
                    </td>
                    <td class="py-3 px-4">
                      <button class="px-3 py-1h bg-in600 c-white r-lg tx-8 fw-9 upcase">Train →</button>
                    </td>
                  </tr>`;
                })
              )
            )}
          </tbody>
        </table>
      </div>
    </div>` : null}

  </div>`;
}

function TargetingDashboard({ decls, assignedCCP, allDecls }) {
  const [tab, setTab]         = useState('targets');
  const [selDecl, setSelDecl] = useState(null);

  const score = d => d.engineScore||d.riskScore||10;
  const chC   = ch => ch==='RED'?'#ef4444':ch==='YELLOW'?'#f59e0b':'#10b981';

  // Events: any RED or YELLOW declaration = a targeting event
  const events = (decls||[])
    .filter(d=>d.assignedChannel==='RED'||d.assignedChannel==='YELLOW')
    .sort((a,b)=>score(b)-score(a));

  // High-priority targets (RED)
  const targets = (decls||[]).filter(d=>d.assignedChannel==='RED').sort((a,b)=>score(b)-score(a));

  // All declarations sorted by score for the list view
  const all = [...(decls||[])].sort((a,b)=>score(b)-score(a));

  // Stats
  const nRed = targets.length;
  const nYel = (decls||[]).filter(d=>d.assignedChannel==='YELLOW').length;
  const hitRate = (decls||[]).length>0
    ? Math.round((decls||[]).filter(d=>d.isHit).length/(decls||[]).length*100)

function ScenarioTrainer({ post, onClear, decls }) {
  const [loading,   setLoading]   = useState(false);
  const [scenario,  setScenario]  = useState(null);
  const [dtResult,  setDtResult]  = useState(null);
  const isAir   = post.type === 'aerian';
  const isRail  = post.type === 'feroviar';
  const isNaval = post.code === '3040' || post.code === '3041' || (post.note && post.note.includes('naval'));

  const [form, setForm] = useState({
    // common
    dest:'Romania', freq:'sometimes', origin:'', goods:'', value:'', hsCode:'', direction:'entering',
    // road — mode: personal | cargo | coach
    roadMode:'personal', veh:'Car', plate:'', vehicleCountry:'', vehicleMake:'', cargoType:'General',
    coachLine:'', coachNumber:'',
    // air
    flightType:'PASSENGER', airline:'', flightNumber:'', originAirport:'', destAirport:'',
    passengerLastName:'', passengerFirstName:'', passengerPassport:'', passengerNationality:'',
    cargoWeight:'', cargoManifest:'', cargoDesc:'',
    // rail
    trainNumber:'', trainMode:'passenger', carrier:'', wagonNumber:'',
    // naval
    vesselName:'', imoNumber:'', vesselType:'', containerCount:'', billOfLading:''
  });
  const setF = (k,v) => setForm(f=>({...f,[k]:v}));

  const typeStyle = {
    rutier:   {bg:'bg-em50',  bc:'bc-em200', tc:'c-em7',  dot:'bg-em500', icon:'🛣'},
    feroviar: {bg:'bg-in50',  bc:'bc-in200', tc:'c-in6',  dot:'bg-in500', icon:'🚂'},
    aerian:   {bg:'bg-ro50',  bc:'bc-ro200', tc:'c-ro7',  dot:'bg-ro600', icon:'✈️'},
    naval:    {bg:'bg-am50',  bc:'bc-am200', tc:'c-am7',  dot:'bg-am400', icon:'⚓'}
  }[isNaval?'naval':post.type] || {bg:'bg-sl50',bc:'bc-sl200',tc:'c-sl6',dot:'bg-sl400',icon:'📍'};

  const calcDT = () => {
    const vehForLookup = isAir ? 'Van' : form.veh; // DT table is road-based; air uses proxy
    const row = RISK_TABLE.find(r=>
      r.dest.toLowerCase()===form.dest.toLowerCase() &&
      r.veh.toLowerCase()===vehForLookup.toLowerCase() &&
      r.freq.toLowerCase()===form.freq.toLowerCase()
    );
    if(row) { setDtResult(row); return row; }
    const byFreq = RISK_TABLE.filter(r=>r.freq===form.freq);
    if(byFreq.length) { setDtResult(byFreq[0]); return byFreq[0]; }
    setDtResult(RISK_TABLE[0]); return RISK_TABLE[0];
  };

  const rfScore = () => {
    const mockDecl = {
      originCountry:form.origin||'RO',
      transportType:isAir?(form.flightType==='PASSENGER'?'AIR_PASSENGER':'AIR_CARGO'):isRail?'TRAIN':isNaval?'FREIGHT_WAGON':'VAN',
      licensePlate:form.plate, itemDescription:form.goods,
      declaredValue:parseFloat(form.value)||0, hsCode:form.hsCode,
      dtDestination:form.dest, dtVehicle:isAir?'Aircraft':isRail?'Train':isNaval?'Vessel':form.veh,
      dtFrequency:form.freq, selectedCCP:post.code,
      timeSinceLastDeclaration:7, frequency:4, schengenFrequency:0,
      originCountryRisk:form.origin==='UA'||form.origin==='BY'?0.8:0.3,
      transitModeAccessibility:0.5
    };
    return rfPredict(mockDecl, decls||MOCK_DECLARATIONS);
  };

  const train = async () => {
    setLoading(true);
    const dt = calcDT();
    const rf = rfScore();
    const p  = Math.round(rf.probability * 100);
    const rfLevel = p>=70?'HIGH':p>=40?'MEDIUM':'LOW';
    try {
      const histCount = (decls||[]).filter(d=>d.selectedCCP===post.code).length;
      const modeContext = isAir
        ? `Flight type: ${form.flightType==='PASSENGER'?'Passenger':'Cargo'}\nAirline: ${form.airline||'—'}, Flight: ${form.flightNumber||'—'}\nRoute: ${form.originAirport||'—'} → ${form.destAirport||'—'}\n${form.flightType==='PASSENGER'?`Passenger: ${form.passengerLastName||'—'}, ${form.passengerFirstName||'—'} · Passport: ${form.passengerPassport||'—'}`:`Cargo: ${form.cargoWeight||'—'}kg, AWB: ${form.cargoManifest||'—'}`}`
        : isRail
        ? `Train: ${form.trainNumber||'—'}, Mode: ${form.trainMode}, Carrier: ${form.carrier||'—'}, Wagon: ${form.wagonNumber||'—'}${form.trainMode==='cargo'?', Cargo type: '+(form.cargoType||'General'):''}`
        : isNaval
        ? `Vessel: ${form.vesselName||'—'}, IMO: ${form.imoNumber||'—'}, Type: ${form.vesselType||'—'}\nContainers: ${form.containerCount||'—'}, Bill of Lading: ${form.billOfLading||'—'}`
        : `Mode: ${form.roadMode}, Vehicle: ${form.veh}, Plate: ${form.plate||'—'}, Country: ${form.vehicleCountry||'—'}${form.roadMode==='cargo'?', Cargo type: '+(form.cargoType||'General'):''}`;
      const cpType = isAir?'Airport':isRail?'Railway':isNaval?'Sea Port (PIL Giurgiulești)':'Road';
      const msg = `Moldova Customs — Random Forest Risk Scenario Training

═══ CHECKPOINT ═══
Name: "${post.name}" | Code: ${post.code} | Type: ${cpType}
Destination: ${form.dest}, Origin: ${form.origin||'—'}, Frequency: ${form.freq}
${modeContext}
Goods: ${form.goods||'unspecified'}, HS: ${form.hsCode||'N/A'}, Value: €${form.value||0}
Historical cases at this CCP: ${histCount}

═══ RANDOM FOREST ASSESSMENT (PRIMARY BASIS FOR TRAINING) ═══
RF Fraud Probability: ${p}% → ${rfLevel} RISK
• Value gap (declared vs market): ${Math.round((rf.valueGap||0))}%
• Non-compliance rate (past violations): ${Math.round((rf.features?.ncFactor||0)*100)}%
• Goods risk (HS code category): ${Math.round((rf.features?.goodsRisk||0)*100)}%
• Origin country risk: ${Math.round((rf.features?.destRisk||0)*100)}%
• Top similar past cases: ${rf.topNeighbors?.map(n=>`${n.id||'case'} (Grade ${n.grade})`).join(', ')||'none matched'}

═══ DECISION TREE (CROSS-REFERENCE) ═══
Grade ${dt.grade} (${dt.band}) → Channel: ${dt.channel}
DT inputs: ${form.dest} + ${isAir?'Aircraft ('+form.flightType+')':isRail?'Train':isNaval?'Vessel':form.veh} + ${form.freq}

═══ TRAINING REQUEST ═══
Based on the Random Forest analysis above (${p}% fraud probability, ${rfLevel} RISK), generate a practical customs officer training scenario:
1. What does the RF score of ${p}% mean for this crossing — explain in plain language for a non-technical officer
2. Which specific RF indicators are most concerning and why (focus on the highest-scoring ones)
3. Step-by-step inspection protocol based on the RF risk level (${rfLevel}): what to check, in what order
4. Historical pattern: what similar cases (Grade ${dt.grade}) at ${post.name} typically reveal
5. Decision: RED / YELLOW / GREEN recommendation and justification (30 words max)`;
      const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,system:'You are a Moldova Customs risk training system. Base your scenario on the Random Forest score provided. Be concise, practical, and avoid mathematical jargon — write for a customs officer, not a data scientist.',messages:[{role:'user',content:msg}]})});
      const data = await res.json();
      setScenario(data.content?.[0]?.text||'No response.');
    } catch(e){setScenario('Connection error.');} finally{setLoading(false);}
  };
