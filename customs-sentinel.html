/* ── RF Fraud Risk Engine — uses past scenarios as training data ── */
/* ─────────────────────────────────────────────────────────────────────────────
   RF + VEHICLE RISK ENGINE
   Implements:
     computeVehicleRisk(vehicle_features, history, neighbors)
       rf_inst_score   = RF institutional fraud probability
       rf_target_score = RF targeting/customs probability
       econ_score      = min(1, cost / (declared_value + ε))
       temp_score      = (frequency × compression) / max_expected
       net_score       = mean(neighbor.risk) for k-nearest vehicles
       current_score   = Σ wᵢ × scoreᵢ
       final_risk      = λ × history + (1−λ) × current_score
   ───────────────────────────────────────────────────────────────────────────── */

/* Hyperparameters */
const VR_WEIGHTS = { w1:0.25, w2:0.20, w3:0.25, w4:0.15, w5:0.15 };
const VR_LAMBDA = 0.30;   // memory decay — 30% historical, 70% current
const VR_MAX_EXPECTED_FREQ = 20; // max expected crossings per month

function rfPredictInstitutional(features) {
  /* RF_inst — institutional smuggling probability
     Uses: goods risk, value gap, origin risk, frequency */
  const raw = features.goodsRisk * 0.35
            + features.valueGap  * 0.30
            + features.destRisk  * 0.20
            + Math.min(1, features.freq / 20) * 0.15;
  return Math.min(0.99, raw);
}

function rfPredictTargeting(features) {
  /* RF_target — customs targeting probability
     Uses: non-compliance history, temporal compression, nighttime pattern */
  const raw = features.ncFactor     * 0.40
            + features.timeAnomaly  * 0.25
            + features.valueGap     * 0.20
            + features.destRisk     * 0.15;
  return Math.min(0.99, raw);
}

function computeEconScore(declaredValue, fmvBaseline) {
  /* econ_score = min(1, cost / (declared_value + ε))
     cost = FMV − declared; measures underdeclaration severity */
  const epsilon = 0.01;
  const cost = Math.max(0, (fmvBaseline||0) - (declaredValue||0));
  return Math.min(1, cost / ((declaredValue||0) + epsilon));
}

function computeTemporalScore(frequency, recentCrossings, windowDays) {
  /* temp_score = (frequency × compression) / max_expected
     compression = recent_crossings / (windowDays / 30) — burst detection */
  const monthNorm = Math.max(1, windowDays / 30);
  const compression = recentCrossings / monthNorm;
  return Math.min(1, (frequency * compression) / VR_MAX_EXPECTED_FREQ);
}

function computeNetworkScore(vehicle, allVehicles) {
  /* net_score = mean(neighbor.risk) for k=5 nearest vehicles
     Similarity: same type + same registered country + similar frequency */
  const neighbors = allVehicles
    .filter(v => v.plate !== vehicle.plate && v.riskScore > 0)
    .map(v => {
      let sim = 0;
      if(v.type === vehicle.type)           sim += 0.4;
      if(v.registered === vehicle.registered) sim += 0.3;
      const freqDiff = Math.abs((v.totalCrossings||0) - (vehicle.totalCrossings||0));
      sim += Math.max(0, 0.3 - freqDiff * 0.05);
      return { plate: v.plate, risk: (v.riskScore||10)/100, sim };
    })
    .filter(n => n.sim > 0.3)
    .sort((a,b) => b.sim - a.sim)
    .slice(0, 5);

  if(!neighbors.length) return { score: 0, neighbors: [] };
  const score = neighbors.reduce((s,n) => s + n.risk, 0) / neighbors.length;
  return { score: Math.min(1, score), neighbors };
}

function computeVehicleRisk(vp, decls, allVehicles) {
  /* Full algorithm:
       current_score = w1*rf_inst + w2*rf_target + w3*econ + w4*temp + w5*net
       final_risk    = λ × history + (1−λ) × current_score                    */

  const vpDecls  = (decls||[]).filter(d =>
    d.licensePlate === vp.plate ||
    (d.importerName && vp.ownerName &&
     d.importerName.toLowerCase().includes((vp.ownerName||'').split(' ')[0].toLowerCase()))
  );

  /* Build features from most recent declaration + vehicle profile */
  const latest   = vpDecls.sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''))[0];
  const totalVal = vpDecls.reduce((s,d) => s + (d.declaredValue||0), 0);
  const totalFmv = vpDecls.reduce((s,d) => s + (d.fmvBaseline||0), 0);
  const nightCrossings = vpDecls.filter(d => {
    const h = parseInt((d.bqsSlot||'').split(':')[0]);
    return !isNaN(h) && (h < 6 || h >= 22);
  }).length;

  const features = {
    freq:        vp.totalCrossings || vpDecls.length || 1,
    destRisk:    latest?.originCountryRisk || (vp.registered==='Ukraine'||vp.registered==='Belarus'?0.75:vp.registered==='Moldova'?0.15:0.35),
    valueGap:    totalFmv > 0 ? Math.max(0, 1 - totalVal / totalFmv) : 0,
    ncFactor:    latest?.nonComplianceProbability || (vpDecls.filter(d=>d.isHit).length / Math.max(1, vpDecls.length)),
    goodsRisk:   vpDecls.some(d=>['2402.20','2710.12','2208.40','8703.23'].includes(d.hsCode)) ? 0.75 : 0.2,
    timeAnomaly: nightCrossings / Math.max(1, vpDecls.length)
  };

  /* Five component scores */
  const rfInstScore   = rfPredictInstitutional(features);
  const rfTargetScore = rfPredictTargeting(features);
  const econScore     = computeEconScore(totalVal, totalFmv);
  const tempScore     = computeTemporalScore(features.freq, vpDecls.length, 30);
  const netResult     = computeNetworkScore(vp, allVehicles||[]);
  const netScore      = netResult.score;

  /* Weighted combination */
  const { w1, w2, w3, w4, w5 } = VR_WEIGHTS;
  const currentScore = w1*rfInstScore + w2*rfTargetScore + w3*econScore + w4*tempScore + w5*netScore;

  /* Memory-smoothed final risk: λ × history + (1−λ) × current */
  const historyScore = (vp.riskScore||50) / 100;
  const finalRisk    = VR_LAMBDA * historyScore + (1 - VR_LAMBDA) * currentScore;

  return {
    finalRisk:      Math.round(finalRisk * 100),
    currentScore:   Math.round(currentScore * 100),
    historyScore:   Math.round(historyScore * 100),
    components: {
      rfInst:   Math.round(rfInstScore   * 100),
      rfTarget: Math.round(rfTargetScore * 100),
      econ:     Math.round(econScore     * 100),
      temporal: Math.round(tempScore     * 100),
      network:  Math.round(netScore      * 100)
    },
    weights: VR_WEIGHTS,
    lambda:  VR_LAMBDA,
    features,
    neighbors:   netResult.neighbors,
    declarationCount: vpDecls.length,
    hitCount: vpDecls.filter(d=>d.isHit).length
  };
}

/* Legacy rfPredict kept for backward compatibility */
function rfPredict(decl, trainingData) {
  if(!decl || typeof decl !== 'object') return {grade:1,score:10,confidence:50,probability:0.1,fraudProb:10,topNeighbors:[],features:{},valueGap:0};
  const trainingSet = (trainingData||[]).filter(Boolean);
  const features = {
    freq:      decl.frequency || 1,
    destRisk:  decl.originCountryRisk || 0.2,
    valueGap:  decl.fmvBaseline > 0 ? Math.max(0, 1 - (decl.declaredValue||0) / decl.fmvBaseline) : 0,
    ncFactor:  decl.nonComplianceProbability || 0.1,
    goodsRisk: ['2402.20','2710.12','2208.40','8703.23'].includes(decl.hsCode) ? 0.8 : 0.2,
    timeAnomaly: 0
  };
  const similar = trainingSet.filter(t=>t&&t.id!==decl.id&&t.dtGrade).map(t=>{
    const sim = 1 - Math.abs((t.nonComplianceProbability||0.1) - features.ncFactor)
               - Math.abs((t.originCountryRisk||0.1) - features.destRisk) * 0.5;
    return {grade: t.dtGrade, weight: Math.max(0, sim), id: t.id};
  }).filter(t=>t.weight>0).sort((a,b)=>b.weight-a.weight).slice(0,10);

  if(!similar.length) return {grade:1, score:10, confidence:50, probability:0.1, fraudProb:10, topNeighbors:[]};
  const totalW   = similar.reduce((s,t)=>s+t.weight, 0);
  const avgGrade = similar.reduce((s,t)=>s+t.grade*t.weight,0) / totalW;
  const fraudProb= Math.min(0.99, features.valueGap*0.4 + features.ncFactor*0.3 + features.goodsRisk*0.2 + (avgGrade/4)*0.1);
  const rfScore  = Math.round(10 + fraudProb * 89);
  return {
    grade: Math.round(avgGrade), score: rfScore, confidence: Math.round(Math.min(99, totalW*20)),
    fraudProb: Math.round(fraudProb*100), probability: fraudProb,
    topNeighbors: similar.slice(0,3), valueGap: Math.round(features.valueGap*100), features
  };
}

function NoDeclarationPanel({ decls }) {
  const [keywords, setKeywords] = useState("");
  const [result,   setResult]   = useState(null);
  const [loading,  setLoading]  = useState(false);

  const analyze = async () => {
    if(!keywords.trim()) return;
    setLoading(true); setResult(null);
    const kw = keywords.toLowerCase();
    let score = 10;
    const flags = [];
    if(/cigar|tobacco|smoke|carton|2402/.test(kw))          { score+=45; flags.push("Tobacco goods — HS 2402.20 — mandatory inspection"); }
    if(/cash|euro|usd|currency|wallet|\d{5,}/.test(kw))     { score+=38; flags.push("Possible undeclared currency — AML threshold €10 000"); }
    if(/fuel|petrol|diesel|jerry|container|tank|2710/.test(kw)){ score+=35; flags.push("Fuel containers — HS 2710 smuggling pattern"); }
    if(/spare|parts|dismantle|scrap|old.car|8708|8703/.test(kw)){ score+=32; flags.push("Vehicle/spare parts — Art. 218 CC RM applies"); }
    if(/nervous|hesitant|refuses?|avoid|sweating|fidget/.test(kw)){ score+=30; flags.push("Suspicious behaviour observed"); }
    if(/alcohol|spirit|vodka|wine|bottle|2208/.test(kw))    { score+=28; flags.push("Alcohol — excise duty may apply"); }
    if(/foreign|plate|non.md|[a-z]{2}-\d/.test(kw))         { score+=22; flags.push("Foreign plate — 90-day temporary import check"); }
    if(/frequent|repeat|daily|3\+|week|multiple/.test(kw))  { score+=18; flags.push("High crossing frequency — evasion pattern"); }
    if(/no.doc|without|missing|blank|refused/.test(kw))     { score+=40; flags.push("No documentation presented"); }

    const rfScore = Math.min(99, score);
    const lane    = rfScore>=75?"RED":rfScore>=40?"YELLOW":"GREEN";

    const similar = decls.filter(d=>d.dtGrade).filter(d=>{
      const t = (d.itemDescription||"").toLowerCase()+(d.mainRiskType||"").toLowerCase();
      return (flags.some(f=>f.includes("Tobacco")) && t.includes("cigar")) ||
             (flags.some(f=>f.includes("currency")) && (d.mainRiskType||"").includes("CURRENCY")) ||
             (flags.some(f=>f.includes("spare")) && d.hsCode==="8703.23") ||
             (flags.some(f=>f.includes("Fuel")) && d.hsCode==="2710.12") ||
             (flags.some(f=>f.includes("Alcohol")) && d.hsCode==="2208.40") ||
             Math.abs((d.riskScore||0) - rfScore) <= 15;
    }).slice(0,3);

    let aiInsight = null;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:180,
          system:"You are a Moldova Customs officer assistant. In 2 sentences, give a direct, practical recommendation for what the officer should do right now.",
          messages:[{role:"user",content:`Officer observation (no declaration): "${keywords}". RF risk score: ${rfScore}/100. Flags: ${flags.join("; ")||"none"}.`}]
        })
      });
      const data = await res.json();
      aiInsight = data.content?.[0]?.text||null;
    } catch(e){}

    setResult({score:rfScore, lane, flags, similar, aiInsight});
    setLoading(false);
  };

  const lC  = l => l==="RED"?"c-r6":l==="YELLOW"?"c-am7":"c-em7";
  const lBg = l => l==="RED"?"bg-r50 bc-r200":l==="YELLOW"?"bg-am50 bc-am200":"bg-em50 bc-em200";

  return html`<div class="bg-white r-2xl b-1 bc-sl200 sh-sm of-hidden">
    <div class="p-4 bb bc-sl100 bg-sl50">
      <h3 class="tx-10 fw-9 c-sl4 upcase ls-widest">🚫 Cases Without Declarations</h3>
      <p class="tx-9 fw-5 c-sl5 italic mt-1">Officer observes suspicious goods or behaviour — no formal customs declaration submitted. Describe what you see and get an instant RF risk score against ${decls.filter(d=>d.dtGrade).length} past cases.</p>
    </div>
    <div class="p-4 sy3">
      <textarea value=${keywords} onInput=${e=>setKeywords(e.target.value)} rows="3"
        placeholder="e.g. foreign plate, nervous, old car, refuses to open boot, 3rd crossing this week…"
        style="width:100%;border:1px solid #e2e8f0;border-radius:.625rem;padding:.75rem;font-size:13px;font-family:inherit;outline:none;resize:vertical;line-height:1.6;color:#1e293b"></textarea>
      <button onClick=${analyze} disabled=${loading||!keywords.trim()}
        class=${"w-full py-3 r-xl tx-sm fw-9 upcase sh-md tr-all " + (loading||!keywords.trim()?"bg-sl100 c-sl4 cur-default":"bg-sl900 c-white h-bg-black cur-pointer")}>
        ${loading?"Analysing with RF model…":"Assess Risk →"}
      </button>
    </div>
    ${result?html`
      <div class=${"mx-4 mb-4 p-4 r-2xl b-1 sy3 " + lBg(result.lane)}>
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div>
            <p class=${"tx-2xl fw-9 " + lC(result.lane)}>${result.score} / 100</p>
            <p class=${"tx-sm fw-9 upcase " + lC(result.lane)}>${result.lane==="RED"?"→ Physical inspection required":result.lane==="YELLOW"?"→ Document review required":"→ Low risk — standard processing"}</p>
          </div>
          <p class="tx-8 fw-7 c-sl4 italic">${result.similar.length} similar past cases found</p>
        </div>
        ${result.flags.length?html`
          <div class="sy1">
            ${result.flags.map((f,i)=>html`<p key=${i} class=${"tx-9 fw-7 " + lC(result.lane)}>⚠ ${f}</p>`)}
          </div>`:null}
        ${result.similar.length?html`
          <div>
            <p class="tx-8 fw-9 c-sl4 upcase mb-1">Closest past enforcement cases</p>
            ${result.similar.map(d=>html`
              <div key=${d.id} class="flex items-center gap-2 mb-0h">
                <span class="tx-8 fmono c-in5">${d.id}</span>
                <span class="tx-8 c-sl5 flex-1">${(d.itemDescription||"").split(" (")[0]}</span>
                <span class="tx-8 fw-9 c-sl6 fmono">${d.riskScore}</span>
              </div>`)}
          </div>`:null}
        ${result.aiInsight?html`
          <div class="p-3 bg-white r-xl b-1 bc-sl200">
            <p class="tx-7 fw-9 c-in6 upcase mb-1">AI Recommendation</p>
            <p class="tx-9 fw-5 c-sl7 lh-relax italic">${result.aiInsight}</p>
          </div>`:null}
      </div>`:null}
  </div>`;
}

              <div style="padding:.5rem .75rem"><p style="font-size:11px;color:#334155;margin:0">${(d.itemDescription||'—').slice(0,32)}</p>${d.hsCode&&d.hsCode!=='0000.00'?html`<p style="font-size:9px;color:#94a3b8;margin:0;font-family:monospace">HS ${d.hsCode}</p>`:null}</div>
              <div style="padding:.5rem .75rem"><p style="font-size:11px;font-weight:700;color:#1e293b;margin:0">${d.originCountry||'—'}</p>${d.dtDestination?html`<p style="font-size:9px;color:#64748b;margin:0">→${d.dtDestination}</p>`:null}</div>
              <div style="padding:.5rem .75rem">${d.declaredValue?html`<p style="font-size:11px;font-weight:700;color:#1e293b;margin:0">€${Number(d.declaredValue).toLocaleString()}</p>`:null}</div>
              <div style="padding:.5rem .75rem"><div style=${{display:'inline-flex',alignItems:'center',gap:'.25rem',padding:'.15rem .4rem',borderRadius:'.25rem',background:bg,border:'1px solid '+c+'40'}}><div style=${{width:'.3rem',height:'.3rem',borderRadius:'50%',background:c}}></div><span style=${{fontSize:'9px',fontWeight:700,color:c,textTransform:'uppercase'}}>${ch} ${p}%</span></div></div>
              <div style="padding:.5rem .5rem"><button onClick=${(e)=>{e.stopPropagation();setSelDetail(d);}} style="padding:.15rem .4rem;background:#4f46e5;color:#fff;border:none;border-radius:.25rem;font-size:9px;font-weight:700;cursor:pointer">AUDIT</button></div>
            </div>`;
          })}
        </div>
      </div>
      <${NoDeclarationPanel} decls=${filtered}/>
    </div>

  </div>`;
}



function LiveDeclaration({ assignedCCP, decls, setDecls, setSelDetail, setView, setChFilter }) {
  const TRANS_TYPES = assignedCCP?.type==='aerian'
    ? ['AIR_PASSENGER','AIR_CARGO']
    : assignedCCP?.type==='feroviar'
    ? ['TRAIN_PASSENGER','TRAIN_CARGO']
    : ['CAR','VAN','TRUCK','BUS','MOTORCYCLE'];

  const [form, setForm] = useState({
    licensePlate:'', importerName:'', originCountry:'',
    itemDescription:'', hsCode:'', declaredValue:'',
    transportType: TRANS_TYPES[0],
    dtDestination:'Romania', dtFrequency:'sometimes',
    passengerLastName:'', passengerFirstName:'', passengerPassport:'',
    flightNumber:'', trainNumber:'', cargoWeight:'',
    direction:'entering', notes:'',
  });
  const [rfResult, setRfResult] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  const [hsSuggestions, setHsSuggestions] = useState([]);

  const setF = (k,v) => {
    const upd = {...form,[k]:v};
    setForm(upd);
    // Auto-suggest HS codes when goods description is typed
    if(k==='itemDescription') {
      const suggestions = lookupHS(v);
      setHsSuggestions(suggestions);
      // Auto-fill HS code if there's exactly one strong match
      if(suggestions.length===1 && !form.hsCode) {
        upd.hsCode = suggestions[0].hs;
        setForm({...upd, hsCode:suggestions[0].hs});
      }
    }
    // Re-run RF every field change
    const mock = {
      id:'LIVE-PREVIEW',
      licensePlate:upd.licensePlate||'—',
      transportType:upd.transportType,
      itemDescription:upd.itemDescription||'—',
      declaredValue:parseFloat(upd.declaredValue)||0,
      fmvBaseline:parseFloat(upd.declaredValue)||0,
      hsCode:upd.hsCode||'0000.00',
      originCountry:upd.originCountry||'XX',
      selectedCCP:assignedCCP?.code||'',
      dtDestination:upd.dtDestination,
      dtVehicle:upd.transportType,
      dtFrequency:upd.dtFrequency,
      isHit:false,
      nonComplianceProbability:0.2,
      originCountryRisk:['UA','BY','RU'].includes(upd.originCountry)?0.8:0.3,
      timeSinceLastDeclaration:7,frequency:3,
      transitModeAccessibility:0.5,schengenFrequency:0,
    };
    try { setRfResult(rfPredict(mock, decls||[])); } catch(e){}
  };

  const submit = () => {
    const p = rfResult?.probability || 0.3;
    const ch = p>=0.7?'RED':p>=0.4?'YELLOW':'GREEN';
    const ts = Date.now();
    const id = 'LIVE-'+(ts%100000);
    const decl = runRiskEngine([{
      id, mrn:id,
      licensePlate:form.licensePlate||'—',
      importerName:form.importerName||'—',
      exporter:'—', originPort:assignedCCP?.name||'—',
      transportType:form.transportType,
      vehicleType:form.transportType,
      itemDescription:form.itemDescription||'—',
      declaredValue:parseFloat(form.declaredValue)||0,
      fmvBaseline:parseFloat(form.declaredValue)||0,
      hsCode:form.hsCode||'0000.00',
      originCountry:form.originCountry||'XX',
      finalDestination:form.dtDestination,
      dtDestination:form.dtDestination,
      dtVehicle:form.transportType,
      dtFrequency:form.dtFrequency,
      direction:form.direction,
      selectedCCP:assignedCCP?.code||'',
      location:assignedCCP?.name+' BCP',
      bqsSlot:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
      timestamp:new Date().toISOString(),
      riskScore:Math.round(p*100),
      asycudaScore:Math.round(p*100),
      assignedChannel:ch,selectedCorridor:ch==='GREEN'?'GREEN':'T1',
      engineScore:Math.round(p*100),engineLane:ch,engineProcessed:true,
      nonComplianceProbability:p,
      originCountryRisk:['UA','BY','RU'].includes(form.originCountry)?0.8:0.3,
      passengerLastName:form.passengerLastName,passengerFirstName:form.passengerFirstName,
      passengerPassport:form.passengerPassport,
      flightNumber:form.flightNumber,trainNumber:form.trainNumber,
      riskReason:form.notes||('RF: '+Math.round(p*100)+'% — '+ch),
      dtGrade:p>=0.75?4:p>=0.5?3:2,
      cargoCategory:'STANDARD',isAEO:false,nctsEnabled:false,
      isConventionMember:false,guaranteeStatusMet:false,guaranteeValue:0,
      declaredDuty:0,predictedCorrectDuty:0,queueSurgeFactor:0.5,
      timeSinceLastDeclaration:7,frequency:3,transitModeAccessibility:0.5,schengenFrequency:0,
      expectedProcessingTime:ch==='RED'?45:ch==='YELLOW'?20:8,
    }])[0];
    setDecls(prev=>[decl,...prev]);
    setSubmitted(true);
    // Navigate to command center immediately — new declaration will be at the top
    setChFilter && setChFilter('ALL');
    setTimeout(()=>{ setView('customs-intelligence'); setSelDetail(decl); }, 400);
  };

  const p = rfResult?.probability||0;
  const ch = p>=0.7?'RED':p>=0.4?'YELLOW':'GREEN';
  const chColor = p>=0.7?'#ef4444':p>=0.4?'#f59e0b':'#10b981';
  const chBg    = p>=0.7?'#fff5f5':p>=0.4?'#fffbeb':'#f0fdf4';
  const chBdr   = p>=0.7?'#fca5a5':p>=0.4?'#fcd34d':'#86efac';
  const hasInput = form.originCountry||form.itemDescription||form.licensePlate||form.hsCode;

  const inp = (k, ph, type='text') => html`
    <input type=${type} placeholder=${ph} value=${form[k]}

  const liveDeclsAtCCP = (decls||[]).filter(d=>
    (d.id.startsWith('LIVE')||d.isLive) &&
    (d.selectedCCP===assignedCCP?.code||d.location?.includes((assignedCCP?.name||'').split(' ')[0]))

        <div style="width:2.25rem;height:2.25rem;background:#1e40af;border-radius:.5rem;flex-shrink:0;display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <div>
          <p style="font-size:11px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:.1em;margin:0 0 .25rem">ASYCUDA World — Sistemul Informațional Vamal</p>
          <p style="font-size:12px;color:#1e3a8a;margin:0;line-height:1.65">
            ASYCUDA World este un sistem informațional, parte componentă a Sistemului informațional integrat vamal. Acesta asigură gestionarea și procesarea formularelor și actelor vamale, utilizate în cadrul procedurilor de vămuire.
            <span style="color:#1d4ed8;font-style:italic"> / ASYCUDA World is an information system forming part of the Integrated Customs Information System. It ensures the management and processing of customs forms and documents used in customs clearance procedures.</span>
          </p>
        </div>
      </div>
    </div>

    <div class="grid xl-cols-12 gap-6">

      <!-- Form (8 cols) -->
      <div class="xl-col8 sy5">

        <!-- Transport identity -->
        <div class="bg-white r-2xl b-1 bc-sl200 sh-sm p-6 sy4">
          <p class="tx-10 fw-9 c-sl4 upcase ls-widest mb-4 pb-3 bb bc-sl100">Transport & Identity</p>
          <div class="grid cols-2 gap-4">
            <div>
              ${lbl('Transport type')}
              <select value=${form.transportType} onChange=${e=>setF('transportType',e.target.value)}
                style="width:100%;padding:.625rem .875rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:13px;color:#1e293b;background:#fff">
                ${TRANS_TYPES.map(t=>html`<option key=${t} value=${t}>${t.replace(/_/g,' ')}</option>`)}
              </select>
            </div>
            <div>${lbl('Direction')}
              <select value=${form.direction} onChange=${e=>setF('direction',e.target.value)}
                style="width:100%;padding:.625rem .875rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:13px;color:#1e293b;background:#fff">
                <option value="entering">Entering Moldova</option>
                <option value="exiting">Exiting Moldova</option>

              </select>
            </div>
            ${isAir ? html`
              <div>${lbl('Flight number')}${inp('flightNumber','e.g. 9U 301')}</div>
              <div>${lbl('Passenger last name')}${inp('passengerLastName','SURNAME')}</div>
              <div>${lbl('Passenger first name')}${inp('passengerFirstName','First name')}</div>
              <div>${lbl('Passport / ID')}${inp('passengerPassport','MD-A1234567')}</div>` :
            isRail ? html`
              <div>${lbl('Train number')}${inp('trainNumber','e.g. IR 1832')}</div>
              <div>${lbl('Passenger / Wagon')}${inp('passengerLastName','Passenger surname or wagon #')}</div>` : html`
              <div>${lbl('Plate number')}${inp('licensePlate','e.g. B-14-TRX')}</div>
              <div>${lbl('Driver / Importer name')}${inp('importerName','Full name or company')}</div>`}
            <div>${lbl('Origin country (ISO)')}${inp('originCountry','e.g. UA, RO, TR')}</div>
            <div>${lbl('Destination')}
              <select value=${form.dtDestination} onChange=${e=>setF('dtDestination',e.target.value)}
                style="width:100%;padding:.625rem .875rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:13px;color:#1e293b;background:#fff">
                ${['Romania','Ukraine','Germany','France','Italy','Belgium','Turkey','United Kingdom','Other'].map(d=>html`<option key=${d} value=${d}>${d}</option>`)}

            </div>
            <div>${lbl('Crossing frequency')}
              <select value=${form.dtFrequency} onChange=${e=>setF('dtFrequency',e.target.value)}

                ${['never','sometimes','often','usually'].map(f=>html`<option key=${f} value=${f}>${f}</option>`)}
              </select>
            </div>
          </div>
        </div>

        <!-- Goods -->
        <div class="bg-white r-2xl b-1 bc-sl200 sh-sm p-6 sy4">
          <div class="flex items-center justify-between mb-4 pb-3 bb bc-sl100">
            <p class="tx-10 fw-9 c-sl4 upcase ls-widest">Goods & Value</p>
            <span class="tx-8 fw-7 c-in6 italic">Asycuda World — SAD Item</span>
          </div>
          <div class="grid cols-2 gap-4">

              ${form.hsCode&&HS_REGISTRY&&HS_REGISTRY[form.hsCode]?html`

            <div>${lbl('Currency')}
              <select value=${form.currency||'EUR'} onChange=${e=>setF('currency',e.target.value)}

              ${form.hsCode?html`<span class="tx-8 fw-9 c-in4 fmono bg-in900 px-2 py-0h r-lg">HS: ${form.hsCode}</span>`:null}

              <p style=${{fontSize:'14px',fontWeight:700,color:chColor,textTransform:'uppercase'}}>${ch} CHANNEL</p>
              <p style="font-size:11px;color:#64748b;margin:.375rem 0 0">
                ${p>=0.7?'⚠ Physical inspection required':p>=0.4?'📋 Document verification needed':'✓ Standard clearance'}
              </p>
            </div>
            <div style="height:6px;background:rgba(255,255,255,.08);border-radius:9999px;overflow:hidden;margin-bottom:1rem">
              <div style=${{width:Math.round(p*100)+'%',height:'100%',background:chColor,borderRadius:'9999px',transition:'width .4s'}}></div>
            </div>
            ${rfResult?.topNeighbors?.length?html`
              <div style="border-top:1px solid rgba(255,255,255,.08);padding-top:.875rem">
                <p style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .5rem">Most similar past cases</p>
                ${rfResult.topNeighbors.map((n,i)=>html`
                  <div key=${i} style="display:flex;align-items:center;gap:.625rem;margin-bottom:.375rem">
                    <div style=${{width:'.375rem',height:'.375rem',borderRadius:'50%',background:n.weight>=0.7?'#ef4444':n.weight>=0.4?'#f59e0b':'#10b981',flexShrink:0}}></div>
                    <span style="font-size:11px;font-weight:700;color:rgba(255,255,255,.7);font-family:monospace">${n.id||'case-'+i}</span>
                    <span style="font-size:10px;color:#475569;margin-left:auto">G${n.grade}</span>
                  </div>`)}
              </div>`:null}` : html`
            <div style="text-align:center;padding:2rem 0">
              <p style="font-size:12px;color:rgba(255,255,255,.3);font-style:italic">Start filling the form to see the RF risk score update in real time</p>
            </div>`}

          <!-- Past events context -->
          <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.08)">
            <p style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .5rem">Training data at this CCP</p>
            <p style="font-size:11px;color:rgba(255,255,255,.5)">
              ${(decls||[]).filter(d=>d.selectedCCP===assignedCCP?.code).length} past events ·
              ${(decls||[]).filter(d=>d.selectedCCP===assignedCCP?.code&&d.assignedChannel==='RED').length} RED ·
              ${(decls||[]).filter(d=>d.selectedCCP===assignedCCP?.code&&d.isHit).length} hits
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>`;
}

        const isAirCCP   = ccpType === 'aerian';

        // Transport type filter per CCP type
        const roadTypes  = ['CAR','VAN','TRUCK','BUS','MOTORCYCLE','MINIVAN'];
        const railTypes  = ['TRAIN_PASSENGER','TRAIN_CARGO','FREIGHT_WAGON','TRANSIT_WAGON'];
        const airTypes   = ['AIR_PASSENGER','AIR_CARGO'];

        const matchesCCPType = d => {
          const tp   = (d.transportType||d.vehicleType||'').toUpperCase();
          const plate = d.licensePlate && d.licensePlate !== '—' && d.licensePlate !== '';
          const train = d.trainNumber  && d.trainNumber  !== '—' && d.trainNumber  !== '';
          const flight= d.flightNumber && d.flightNumber !== '—' && d.flightNumber !== '';
          if(isRailCCP) return tp.includes('TRAIN') || tp.includes('WAGON') || tp.includes('RAIL') || tp.includes('FREIGHT') || train;
          if(isAirCCP)  return tp.includes('AIR') || tp.includes('FLIGHT') || flight;
          // Road: only road vehicle types — do NOT match rail/air transport types
          if(tp.includes('TRAIN')||tp.includes('WAGON')||tp.includes('RAIL')||tp.includes('AIR')||tp.includes('FLIGHT')) return false;
          return !tp || roadTypes.includes(tp) || tp.includes('TRUCK') || tp.includes('VAN') || tp.includes('CAR') || tp.includes('BUS') || plate;
        };

        const ccpNcts = ccpDecls.filter(d => isNcts(d) && matchesCCPType(d));
        // If no NCTS cases at this CCP, show typed demo cases from mock data for demonstration
        const allNCTS = ccpNcts.length > 0 ? ccpNcts : decls.filter(d => isNcts(d) && matchesCCPType(d));
        const isDemo  = ccpNcts.length === 0;

        // NCTS risk evaluator — each check maps to a Core Aspect
        const nctsRisk = d => {
          const risks = [];

          // ⚡ Real-Time Assessment — is NCTS electronically active?
          if(!d.nctsEnabled && d.direction==='transit')
            risks.push({level:2,icon:'🔴',aspect:'⚡ Real-Time Assessment',
              text:'NCTS procedure NOT active — electronic T1/T2 not initiated',
              action:'Verify paper transit document at entry and exit CCP. NCTS-P5 pre-arrival analysis unavailable.',
              criterion:'NCTS processes electronic T1/T2 declarations. Without it, pre-arrival risk assessment is impossible.'});
          else if(d.nctsEnabled)
            risks.push({level:0,icon:'🟢',aspect:'⚡ Real-Time Assessment',
              text:'NCTS electronically active — MRN tracked, pre-arrival data received',
              action:'Verify MRN on printed document matches system record.',
              criterion:'NCTS-P5 safety & security data integrated — risk assessed before goods reach customs.'});

          // 💶 Guarantee Management — is the guarantee adequate?
          if(!d.guaranteeStatusMet || !d.guaranteeValue)
            risks.push({level:2,icon:'🔴',aspect:'💶 Guarantee Management',
              text:'No financial guarantee on file — full duty exposure if goods disappear',
              action:'Do NOT release. Request guarantee or cash deposit before transit is authorised.',
              criterion:'Risk assessment determines validity and release of movement guarantee — insufficient coverage triggers a hold.'});
          else if(d.guaranteeValue < (d.declaredValue||0)*0.05)
            risks.push({level:2,icon:'🔴',aspect:'💶 Guarantee Management',
              text:'Guarantee €'+d.guaranteeValue.toLocaleString()+' covers only '+(Math.round(d.guaranteeValue/(d.declaredValue||1)*100))+'% of declared value €'+(d.declaredValue||0).toLocaleString(),
              action:'Request guarantee top-up. Minimum 5% of declared value (full duty amount preferred).',
              criterion:'Insufficient coverage triggers a hold — duty + VAT payable immediately if goods do not exit Moldova.'});
          else
            risks.push({level:0,icon:'🟢',aspect:'💶 Guarantee Management',
              text:'Guarantee €'+d.guaranteeValue.toLocaleString()+' — duty adequately covered',
              action:'Confirm guarantee is valid and covers full duty amount.',
              criterion:'Risk assessment confirmed guarantee adequate — movement authorised.'});

          // 📋 Common Risk Criteria — CTC membership
          if(!d.isConventionMember)
            risks.push({level:1,icon:'🟡',aspect:'📋 Common Risk Criteria',
              text:'Operator NOT a CTC Convention member — no simplified procedures apply',
              action:'Full paper T1/T2 documentation required. Verify all stamps, signatures and declarations.',
              criterion:'Harmonized criteria across CTC nations — non-members face full documentary controls.'});
          else
            risks.push({level:0,icon:'🟢',aspect:'📋 Common Risk Criteria',
              text:'CTC Convention member — simplified transit procedures authorised',
              action:'Check membership certificate is current and matches operator name.',
              criterion:'CTC membership confirmed — common risk criteria satisfied for simplified transit.'});

          // 🔒 Safety & Security — seal integrity
          if(!d.sealNumber && d.direction==='transit')
            risks.push({level:1,icon:'🟡',aspect:'🔒 Safety & Security',
              text:'No customs seal recorded — tamper risk during transit',
              action:'Physically inspect compartment before release. Apply and record seal. No seal = no transit.',
              criterion:'NCTS-P5 requires seal data for pre-arrival analysis and contraband detection.'});
          else if(d.sealNumber)
            risks.push({level:0,icon:'🟢',aspect:'🔒 Safety & Security',
              text:'Seal '+d.sealNumber+' applied and recorded — integrity check required at exit',
              action:'Confirm seal '+d.sealNumber+' is intact, correct number, and matches declaration.',
              criterion:'NCTS-P5 seal verification — IPR, illegal cash movement, contraband detection enabled.'});

          // 🎯 Automatic Routing — destination declared?
          if(d.direction==='transit' && !d.transitCountry)
            risks.push({level:1,icon:'🟡',aspect:'🎯 Automatic Routing',
              text:'Transit destination country not declared — automatic corridor assignment blocked',
              action:'Request complete T1/T2 with declared exit CCP and destination country before release.',
              criterion:'System cannot assign 🟢/🟡/🟠/🔴 corridor without declared exit route — manual review required.'});

          return risks;
        };

        const transitDecls = allNCTS;
        const nHigh = transitDecls.filter(d=>nctsRisk(d).some(r=>r.level===2)).length;
        const nMed  = transitDecls.filter(d=>nctsRisk(d).every(r=>r.level!==2)&&nctsRisk(d).some(r=>r.level===1)).length;
        const nOk   = transitDecls.filter(d=>nctsRisk(d).every(r=>r.level===0)).length;

        return html`<div class="anim-fade sy6 pb-20">
          <div class="flex items-start justify-between flex-wrap gap-4">
            <div>
              <h2 class="tx-2xl fw-9 c-sl9 upcase ls-tighter italic">NCTS / Transit Control</h2>
              <p class="tx-xs fw-7 c-in6 upcase ls-wide mt-1">${assignedCCP?assignedCCP.name+' · '+assignedCCP.code:'All CCPs'} — ${isRailCCP?'🚂 Railway Transit (T1/T2 Wagon/Train)':isAirCCP?'✈ Air Cargo Transit':' 🛣 Road Transit (T1/T2 Truck/Vehicle)'}</p>
            </div>
            <div class="flex gap-3 flex-wrap">
              ${[['🔴 High risk',nHigh,'#fef2f2','#fca5a5','#dc2626'],['🟡 Watch',nMed,'#fffbeb','#fcd34d','#d97706'],['🟢 Clear',nOk,'#f0fdf4','#86efac','#059669']].map(([l,n,bg,bc,tc])=>html`
                <div key=${l} style=${{padding:'.375rem .875rem',background:bg,border:'1px solid '+bc,borderRadius:'.625rem',display:'flex',alignItems:'center',gap:'.5rem'}}>
                  <span style=${{fontSize:'11px',fontWeight:700,color:tc}}>${l}: ${n}</span>
                </div>`)}
            </div>
          </div>

                              <!-- Risk level legend -->
          <div style="display:flex;gap:.625rem;flex-wrap:wrap">
            <div style="padding:.5rem .875rem;background:#fff5f5;border:1px solid #fca5a5;border-radius:.625rem;flex:1;min-width:8rem">
              <p style="font-size:12px;font-weight:700;color:#dc2626;margin:0 0 .2rem">🔴 HIGH RISK</p>
              <p style="font-size:10px;color:#64748b;margin:0">Missing guarantee/seal, NCTS inactive</p>
            </div>
            <div style="padding:.5rem .875rem;background:#fffbeb;border:1px solid #fcd34d;border-radius:.625rem;flex:1;min-width:8rem">
              <p style="font-size:12px;font-weight:700;color:#d97706;margin:0 0 .2rem">🟡 WATCH</p>
              <p style="font-size:10px;color:#64748b;margin:0">Non-CTC member, incomplete docs</p>
            </div>
            <div style="padding:.5rem .875rem;background:#f0fdf4;border:1px solid #86efac;border-radius:.625rem;flex:1;min-width:8rem">
              <p style="font-size:12px;font-weight:700;color:#059669;margin:0 0 .2rem">🟢 CLEAR</p>
              <p style="font-size:10px;color:#64748b;margin:0">AEO operator, full compliance</p>
            </div>
          </div>

          <!-- War transit context banner — shows when Leușeni/Palanca/border CCPs active -->
          ${(()=>{
            const warCount = transitDecls.filter(d=>d.warTransit).length;
            if(!warCount && !['2030','3010','2020','1110','2060'].includes(assignedCCP?.code)) return null;
            return html`<div style="background:#1e293b;border:1px solid #334155;border-radius:.875rem;padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:.875rem">
              <div style="width:2rem;height:2rem;background:#b45309;border-radius:.5rem;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <span style="font-size:12px">🇺🇦</span>
              </div>
              <div>
                <p style="font-size:12px;font-weight:700;color:#fbbf24;margin:0 0 .375rem;text-transform:uppercase;letter-spacing:.06em">War Transit Corridor — Ukraine</p>
                <p style="font-size:11px;color:rgba(255,255,255,.7);margin:0;line-height:1.65">
                  Due to active conflict, heavy truck transit from Odessa, Mykolaiv, and Vinnytsia regions is routing through Moldova to EU countries (and return).
                  Enhanced controls apply: <strong style="color:#fbbf24">dual-use goods check</strong> · <strong style="color:#fbbf24">EU sanctions verification</strong> ·
                  <strong style="color:#fbbf24">humanitarian vs commercial classification</strong> · <strong style="color:#fbbf24">empty vehicle compartment inspection</strong>.
                  EU Temporary Protection Directive 2022/2725 applies to displaced persons' personal effects.
                </p>
                <div style="display:flex;gap:.625rem;flex-wrap:wrap;margin-top:.625rem">
                  ${['UA→MD→RO (Odessa/Mykolaiv/Vinnytsia)','RO/DE/EU→MD→UA (return)','Displaced persons fast-track'].map(r=>html`
                    <span key=${r} style="font-size:10px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);padding:.2rem .625rem;border-radius:9999px">${r}</span>`)}
                </div>
              </div>
            </div>`;
          })()}

          ${isDemo?html`
            <div style="padding:.625rem 1.25rem;background:#fffbeb;border:1px solid #fcd34d;border-radius:.75rem;display:flex;align-items:center;gap:.75rem">
              <span style="font-size:16px">📋</span>
              <p style="font-size:12px;color:#92400e;margin:0;line-height:1.5">
                <strong>Demo mode:</strong> No ${isRailCCP?'railway':isAirCCP?'air':'road'} transit declarations recorded at ${assignedCCP?.name||'this CCP'} yet.
                Showing reference NCTS cases for ${isRailCCP?'railway CCPs (Ungheni · Larga 2 · Volcineț)':isAirCCP?'air CCPs (Chișinău · Mărculești)':'road CCPs (Leușeni · Palanca · Sculeni)'}.
                Live transit declarations appear here when goods pass through this ${isRailCCP?'railway border crossing':isAirCCP?'airport':'road crossing'}.
              </p>
            </div>`:null}

          ${transitDecls.map((d,i)=>{
            const risks = nctsRisk(d);
            const maxLevel = Math.max(...risks.map(r=>r.level));
            const hdrC = maxLevel>=2?'#dc2626':maxLevel>=1?'#d97706':'#059669';
            const hdrBg = maxLevel>=2?'#fff5f5':maxLevel>=1?'#fffbeb':'#f0fdf4';
            const hdrBc = maxLevel>=2?'#fca5a5':maxLevel>=1?'#fcd34d':'#86efac';
            const statusLabel = maxLevel>=2?'⚠ NCTS RISK — HOLD':maxLevel>=1?'⚠ WATCH — REVIEW':'✓ CLEAR — FAST TRACK';

            // Map risk level to automatic routing corridor (per NCTS framework)
            const corridor = maxLevel>=2?'🔴 Red — Physical Inspection':maxLevel>=1?'🟡 Yellow — Document Review':'🟢 Green — Cleared';

            return html`
            <div key=${d.id} style="background:#fff;border-radius:1rem;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e2e8f0">

              <!-- Case header bar -->
              <div style=${{background:'#1e3a8a',padding:'.75rem 1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'.5rem'}}>
                <div style="display:flex;align-items:center;gap:.875rem;flex-wrap:wrap">
                  <span style="font-size:13px;font-weight:900;color:#fff;font-family:monospace">${d.id}</span>
                  ${d.mrn?html`<span style="font-size:10px;font-family:monospace;color:rgba(255,255,255,.55)">MRN: ${d.mrn}</span>`:null}
                  <div style=${{background:hdrC,color:'#fff',fontSize:'10px',fontWeight:700,padding:'.2rem .625rem',borderRadius:'9999px',textTransform:'uppercase'}}>${statusLabel}</div>
                  ${d.warTransit?html`<div style="background:#b45309;color:#fff;font-size:10px;font-weight:700;padding:.2rem .625rem;border-radius:9999px;display:flex;align-items:center;gap:.3rem">🇺🇦 War Transit · ${d.originRegion||'Ukraine'}</div>`:null}
                  ${d.targetingTag==='DUAL_USE_GOODS'?html`<div style="background:#7c3aed;color:#fff;font-size:10px;font-weight:700;padding:.2rem .625rem;border-radius:9999px">⚠ Dual-Use Goods</div>`:null}
                  ${d.transitRoute?html`<span style="font-size:10px;font-family:monospace;color:rgba(255,255,255,.5)">${d.transitRoute}</span>`:null}
                </div>
                <button onClick=${()=>setSelDetail(d)}
                  style="padding:.25rem .75rem;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:.375rem;font-size:11px;font-weight:700;cursor:pointer">
                  AUDIT →
                </button>
              </div>

              <!-- Declaration data grid — transport type aware -->
              <div style="display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #f1f5f9">
                ${(()=>{
                  const transportLabel = isRailCCP ? ('🚂 Train / Wagon') : isAirCCP ? ('✈ Flight / AWB') : ('🚛 Truck / Plate');
                  const transportValue = isRailCCP ? (d.trainNumber||'—') : isAirCCP ? (d.flightNumber||'—') : (d.licensePlate&&d.licensePlate!=='—'?d.licensePlate:'—');
                  const fields = [
                    [transportLabel, transportValue],
                    ['📍 Direction', (d.direction||'—').charAt(0).toUpperCase()+(d.direction||'').slice(1)+' → '+(d.transitCountry||d.dtDestination||'—')],
                    ['🌍 Origin', d.originCountry||'—'],
                    ['📦 Cargo Type', d.cargoCategory||(d.transportType||'').replace(/_/g,' ')||'—'],
                    ['📋 Goods', (d.itemDescription||'—').slice(0,35)],
                    ['🔖 HS Code', d.hsCode&&d.hsCode!=='0000.00'?d.hsCode:'—'],
                    ['💶 Declared Value', d.declaredValue?'€'+Number(d.declaredValue).toLocaleString():'—'],
                    ['🔒 '+(isAirCCP?'Air Waybill':'Seal Number'), d.sealNumber||(d.mrn?'MRN: '+d.mrn:'Not recorded')],
                  ];
                  return fields.map(([lbl,val])=>html`
                    <div key=${lbl} style="padding:.625rem .875rem;border-right:1px solid #f1f5f9">
                      <p style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .2rem">${lbl}</p>
                      <p style="font-size:12px;font-weight:700;color:#1e293b;margin:0;font-family:monospace">${val}</p>
                    </div>`);
                })()}
              </div>

              <!-- NCTS Core Aspects layout (mirrors screenshot: 2-col, Core Aspects + Key Benefits) -->
              <div style="display:grid;grid-template-columns:1fr 1fr">

                <!-- LEFT: Core Aspects of NCTS Risk Analysis -->
                <div style="padding:1rem 1.25rem;border-right:1px solid #f1f5f9">
                  <p style="font-size:10px;font-weight:900;color:#1e40af;text-transform:uppercase;letter-spacing:.1em;margin:0 0 .875rem;padding-bottom:.375rem;border-bottom:2px solid #3b82f6">Core Aspects of NCTS Risk Analysis</p>
                  <div style="display:flex;flex-direction:column;gap:.625rem">
                    ${risks.map((r,ri)=>html`
                      <div key=${ri}>
                        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem">
                          <span style="font-size:12px">${r.icon}</span>
                          <p style=${{fontSize:'12px',fontWeight:700,color:r.level===2?'#dc2626':r.level===1?'#d97706':'#059669',margin:0}}>${r.aspect}</p>
                        </div>
                        <p style="font-size:11px;color:#334155;line-height:1.55;margin:0 0 .2rem 1.5rem">${r.text}</p>
                        ${r.level>0?html`<p style="font-size:10px;color:#64748b;margin:0 0 0 1.5rem;font-style:italic;line-height:1.5">→ ${r.action}</p>`:null}
                        <p style="font-size:10px;color:#94a3b8;margin:.15rem 0 0 1.5rem;line-height:1.45">${r.criterion}</p>
                      </div>`)}
                  </div>
                </div>

                <!-- RIGHT: Key Benefits + Automatic Routing result -->
                <div style="padding:1rem 1.25rem">
                  <p style="font-size:10px;font-weight:900;color:#059669;text-transform:uppercase;letter-spacing:.1em;margin:0 0 .875rem;padding-bottom:.375rem;border-bottom:2px solid #10b981">Key Benefits of Automated Risk Management</p>
                  <div style="display:flex;flex-direction:column;gap:.625rem;margin-bottom:1rem">
                    ${[
                      ['🎯 Improved Targeting',  'RF model cross-references past NCTS transit events at '+( d.selectedCCP||'this CCP')+' to estimate fraud probability.'],
                      ['🚀 Trade Facilitation',  maxLevel===0?'Goods cleared swiftly — '+d.importerName+(d.isAEO?' (AEO operator)':'')+' benefits from simplified procedures.':'Clearance delayed pending resolution of risk controls.'],
                      ['🛡 Fraud Reduction',     'Automated checks on seal, guarantee, and MRN reduce fraudulent documentation or illegal alterations.'],
                      ['💶 Guarantee Management',d.guaranteeValue>0?'Guarantee €'+d.guaranteeValue.toLocaleString()+' assessed against declared value €'+(d.declaredValue||0).toLocaleString()+'.':'No guarantee on file — movement guarantee required before transit can be authorised.'],
                    ].map(([t,desc])=>html`
                      <div key=${t}>
                        <p style="font-size:12px;font-weight:700;color:#1e293b;margin:0 0 .2rem">${t}</p>
                        <p style="font-size:11px;color:#475569;line-height:1.55;margin:0">${desc}</p>
                      </div>`)}
                  </div>
                  <!-- Automatic Routing result -->
                  <div style=${{background:hdrBg,border:'1px solid '+hdrBc,borderRadius:'.625rem',padding:'.625rem .875rem'}}>
                    <p style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin:0 0 .25rem">🎯 Automatic Routing Corridor</p>
                    <p style=${{fontSize:'14px',fontWeight:900,color:hdrC,margin:'0 0 .2rem'}}>${corridor}</p>
                    <p style="font-size:10px;color:#64748b;margin:0">Based on ${risks.length} NCTS control checks · RF score: ${d.riskScore||d.rfFraudProb||0}%</p>
                  </div>
                </div>

              </div>

              <!-- Officer Rule footer -->
              <div style="background:#0f172a;padding:.625rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
                <p style="font-size:11px;color:rgba(255,255,255,.6);margin:0">
                  <strong style="color:#fbbf24">⚠ Officer Rule — Transit ≠ Clearance.</strong>
                  Duties deferred — if goods disappear in Moldova, duty + VAT payable immediately.
                  Verify: <span style="color:#86efac">seal integrity</span> · <span style="color:#86efac">guarantee adequacy</span> · <span style="color:#86efac">MRN match</span> · <span style="color:#86efac">exit CCP confirmation</span>.
                </p>
              </div>

            </div>`;
          })}

          <div style="background:#0f172a;border-radius:.875rem;overflow:hidden">
            <div style="padding:.625rem 1.25rem;background:#b45309;display:flex;align-items:center;gap:.625rem">
              <span style="font-size:13px">⚠</span>
              <p style="font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.08em;margin:0">Officer Rule — Transit ≠ Clearance</p>
            </div>
            <div style="padding:1rem 1.25rem">
              <p style="font-size:12px;color:rgba(255,255,255,.75);margin:0 0 .75rem;line-height:1.7">Duties are <strong style="color:#fbbf24">deferred</strong> — not waived. If goods disappear in Moldova, duty + VAT become <strong style="color:#f87171">immediately payable</strong>. Verify all four controls on every transit declaration:</p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
                ${[['🔒 Seal integrity','Physical seal matches number on declaration — intact, unbroken, correct format'],
                   ['💶 Guarantee adequacy','Guarantee covers full duty amount — check coverage % vs declared value'],
                   ['⚡ MRN match','Electronic MRN matches printed document — NCTS system confirms movement'],
                   ['🎯 Exit CCP confirmation','Goods must exit at declared CCP — verify destination and routing corridor']
                  ].map(([t,d])=>html`<div key=${t} style="background:rgba(255,255,255,.06);border-radius:.5rem;padding:.5rem .75rem">
                    <p style="font-size:11px;font-weight:700;color:#fbbf24;margin:0 0 .15rem">${t}</p>
                    <p style="font-size:10px;color:rgba(255,255,255,.55);margin:0;line-height:1.5">${d}</p>
                  </div>`)}
              </div>
              <p style="font-size:10px;color:rgba(255,255,255,.35);margin:.75rem 0 0;font-style:italic">Common NCTS fraud patterns: goods removed before exit CCP · substituted cargo · false exit confirmation · guarantee abuse · MRN reuse</p>
            </div>
          </div>

        </div>`;
      })()}`;

      default: return html`<div class="p-20 tc c-sl4 fw-7 italic">Module under construction…</div>`;
    }
  };

  return html`<div class="minh-screen bg-f8 flex of-hidden">
    <${Sidebar} currentView=${view} onViewChange=${setView} ccp=${assignedCCP}/>
    <div class="flex-1 flex flex-col minh-screen h-screen of-hidden" style="margin-left:16rem">
      <header class="bg-white bb bc-sl200 px-8 py-4 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
          <div class="w-6 h-6 bg-in600 r-md flex items-center justify-center" style="border-radius:.375rem">
            <div style="width:.75rem;height:.75rem;background:#fff;border-radius:2px"></div>
          </div>
          <h1 class="tx-sm fw-9 c-sl9 ls-tighter" style="font-size:.95rem;font-weight:900;letter-spacing:-.01em">Customs Sentinel</h1>
        </div>
        <div class="flex items-center gap-4">
          ${assignedCCP?html`
            <div class="flex items-center gap-2 px-3 py-1h bg-in50 r-xl b-1 bc-in200">
              <div class="w-1h h-1h bg-in500 r-full pulse"></div>
              <span class="tx-9 fw-9 c-in6 upcase">${assignedCCP.code} · ${assignedCCP.name}</span>
            </div>`:null}
          ${assignedCCP?html`
            <span class="tx-9 fw-7 c-sl5">${assignedCCP.officerName||'Officer'}</span>`:null}
          <button onClick=${()=>setPersona(p=>p==="OFFICER"?"DRIVER":"OFFICER")}
            class="px-4 py-2 r-lg tx-9 fw-9 upcase ls-wide sh-md tr-all bg-in600 c-white h-bg-in700">
            🧳 Traveler Portal
          </button>
        </div>
      </header>
      <!-- CCP identity banner -->
      ${assignedCCP ? html`
        <div style="background:#1e293b;padding:.625rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40">
          <div class="flex items-center gap-3">
            <div class="w-2 h-2 bg-em400 r-full pulse"></div>
            <span style="font-size:11px;font-weight:700;color:#e2e8f0;text-transform:uppercase;letter-spacing:.1em">
              ${assignedCCP.code} · ${assignedCCP.name}
            </span>
            <span style="font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;background:rgba(255,255,255,.08);padding:.125rem .5rem;border-radius:.25rem">
              ${assignedCCP.birou} · ${assignedCCP.type}
            </span>
          </div>
          <button onClick=${()=>setAssignedCCP(null)}
            style="font-size:10px;font-weight:700;color:#64748b;background:none;border:1px solid #334155;padding:.2rem .625rem;border-radius:.375rem;cursor:pointer;text-transform:uppercase">
            Change CCP
          </button>
        </div>` : null}
      <main class="flex-1 ofy-auto bg-f8" style="position:relative">
        <div style="padding:2rem">${(()=>{
          try { return content(); }
          catch(e) {
            console.error('SENTINEL CRASH:', e);
            return html`<div style="padding:2rem;background:#fff5f5;border:2px solid #fca5a5;border-radius:.75rem;margin:1rem">
              <p style="font-size:14px;font-weight:700;color:#dc2626;margin:0 0 .5rem">⚠ Render error</p>
              <p style="font-size:12px;color:#7f1d1d;font-family:monospace;margin:0">${e.message||String(e)}</p>
              <button type="button" onClick=${()=>{setView('customs-intelligence');}}
                style="margin-top:.75rem;padding:.375rem .875rem;background:#dc2626;color:#fff;border:none;border-radius:.375rem;cursor:pointer;font-size:12px">
                Reset view
              </button>
            </div>`;
          }
        })()}</div>
      </main>
    </div>
    ${selDetail?html`<${AuditPanel} declaration=${selDetail} onClose=${()=>setSelDetail(null)}/>`:null}
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
